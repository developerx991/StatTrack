<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StatTrack">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>StatTrack — Трекер прогресса и дисциплины</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Forum&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ==========================================================================
   DARK SOULS THEME: "BLACK KNIGHT OF ASH" (DARK) & "WHITE KNIGHT OF MIST" (LIGHT)
   ========================================================================== */
:root,
[data-theme="dark"] {
  --bg: #070606;
  --bg-alt: #0d0b0a;
  --card: #12100e;
  --card2: #1a1613;
  --surface: #0b0908;
  --ink: #e2d9cc;
  --ink-strong: #f7f0e6;
  --mut: #a39686;
  --line: #382f25;
  --line-gold: #82673c;
  --red: #cc2b32;
  --cy: #dfa655;
  --gr: #52a86f;
  --vi: #9b62c7;
  --ye: #eba43d;
  --or: #e06d2b;
  --ember: #ff551a;
  --accent: #d49b4b;
  --shadow-card: 0 10px 28px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(212, 155, 75, 0.14);
  --glow-ambient: radial-gradient(650px 420px at 50% 0%, rgba(230, 92, 25, 0.14), transparent 70%),
                  radial-gradient(550px 400px at 90% 85%, rgba(184, 41, 47, 0.09), transparent 70%);
  color-scheme: dark;
}

/* HIGH-CONTRAST READABLE LIGHT THEME ("WHITE KNIGHT OF MIST") */
[data-theme="light"] {
  --bg: #e6e2da;
  --bg-alt: #dcd7cd;
  --card: #ffffff;
  --card2: #f7f4ee;
  --surface: #ede9e0;
  --ink: #1e1b18;
  --ink-strong: #0a0908;
  --mut: #4a4238;
  --line: #b5ac9e;
  --line-gold: #80602a;
  --red: #9e1b20;
  --cy: #875512;
  --gr: #1b6938;
  --vi: #56267d;
  --ye: #8f5106;
  --or: #9e3d12;
  --ember: #2d3748;
  --accent: #4a433b;
  --shadow-card: 0 8px 22px rgba(25, 20, 15, 0.08), inset 0 1px 0 #ffffff;
  --glow-ambient: radial-gradient(650px 420px at 50% 0%, rgba(255, 255, 255, 0.8), transparent 70%),
                  radial-gradient(550px 400px at 90% 85%, rgba(140, 130, 115, 0.15), transparent 70%);
  color-scheme: light;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  background: var(--bg);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-tap-highlight-color: transparent;
}
*, *:before, *:after { box-sizing: inherit; margin: 0; }
body {
  min-height: 100vh;
  color: var(--ink);
  font: 400 15px/1.5 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  overflow-x: hidden;
  transition: background-color 0.3s ease, color 0.3s ease;
}
#bg, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: var(--glow-ambient);
}
.wrap {
  max-width: 1040px;
  margin: auto;
  padding: 10px 12px 90px;
  position: relative;
  z-index: 1;
}

/* SOULS SERIF TYPOGRAPHY */
h1, h2, h3, .btn, .chip, .tab, .big, .nm, .kv b, .hud b, .st b, .tag, .rk-name, .logo-txt, .prof-nick, .ach-ttl {
  font-family: 'Cormorant Garamond', 'Forum', Georgia, serif;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.cut { border-radius: 6px; position: relative; }
.cut-sm { border-radius: 4px; }

/* SMOOTH VIEW & TAP ANIMATIONS */
@keyframes viewFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
#main > section {
  animation: viewFadeIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) both;
}
#main > section:nth-child(2) { animation-delay: 0.04s; }
#main > section:nth-child(3) { animation-delay: 0.08s; }

button, .hub-card, .rk-cell, .res-pill, .prof-main-click {
  transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease, filter 0.18s ease;
}
button:active:not(:disabled), .hub-card:active, .rk-cell:active, .res-pill:active {
  transform: scale(0.96) !important;
}

/* ==========================================================================
   COMPACT MOBILE-FIRST HEADER & TOPBAR (NO OVERLAP WITH KEY PILL)
   ========================================================================== */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  flex-wrap: nowrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  user-select: none;
  text-decoration: none;
  color: inherit;
  min-width: 0;
  flex-shrink: 1;
  overflow: hidden;
}
.brand-ic {
  width: 32px;
  height: 32px;
  background: radial-gradient(circle, var(--card2), var(--surface));
  border: 1.5px solid var(--line-gold);
  display: grid;
  place-items: center;
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(212, 155, 75, 0.25);
  flex-shrink: 0;
}
.brand-ic svg { color: var(--cy); width: 18px; height: 18px; }
.logo-txt {
  font-size: 18px;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-strong);
  display: flex;
  align-items: center;
  white-space: nowrap;
}
.logo-txt span { color: var(--cy); }
.logo-sub {
  display: block;
  font: 500 10.5px 'Inter', sans-serif;
  color: var(--mut);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.top-actions {
  display: flex;
  gap: 5px;
  align-items: center;
  margin-left: auto;
  flex-shrink: 0;
}
.top-grp-main, .top-grp-sys {
  display: flex;
  gap: 4px;
  align-items: center;
}
.top-grp-sys {
  padding-left: 5px;
  margin-left: 2px;
  border-left: 1px solid var(--line-gold);
}
.icon-btn {
  background: linear-gradient(180deg, var(--card2), var(--card));
  color: var(--ink-strong);
  border: 1px solid var(--line);
  padding: 6px 9px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font: 600 12px 'Inter', sans-serif;
  min-height: 32px;
}
.icon-btn:hover, .icon-btn.on {
  border-color: var(--cy);
  color: var(--cy);
  box-shadow: 0 0 10px color-mix(in srgb, var(--cy) 25%, transparent);
}
.res-pill {
  background: var(--surface);
  border: 1px solid var(--line-gold);
  padding: 5px 8px;
  font: 600 12px 'Inter', sans-serif;
  color: var(--cy);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  min-height: 32px;
  white-space: nowrap;
}

/* ==========================================================================
   COLLAPSIBLE DRAWER FOR PROFILE & STREAK BONUS BUTTON
   ========================================================================== */
.prof-compact-wrap {
  margin-bottom: 10px;
}
.prof-bar {
  background: linear-gradient(90deg, var(--card2), var(--card));
  border: 1px solid var(--line-gold);
  box-shadow: var(--shadow-card);
  padding: 8px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.prof-left-group {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  flex: 1;
}
.prof-main-click {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  cursor: pointer;
}
.ava {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--accent);
  display: grid;
  place-items: center;
  color: var(--accent);
  box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 30%, transparent);
  flex-shrink: 0;
}
.ava svg { width: 19px; height: 19px; }
.prof-info { min-width: 0; flex: 1; }
.prof-top {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.prof-nick {
  font-size: 17px;
  color: var(--ink-strong);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 135px;
  cursor: pointer;
}
.prof-title {
  font: 600 10.5px 'Inter', sans-serif;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--cy);
  background: color-mix(in srgb, var(--cy) 12%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--cy) 45%, transparent);
  padding: 2px 7px;
  border-radius: 3px;
}
.streak-btn {
  font: 700 11px 'Inter', sans-serif;
  color: #fff;
  background: linear-gradient(135deg, #c9561e, #8f2327);
  border: 1px solid rgba(255, 210, 140, 0.45);
  padding: 3px 8px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(201, 86, 30, 0.35);
}
.streak-btn:hover {
  filter: brightness(1.12);
  border-color: #ffd27d;
}
.prof-mini-ranks {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 2px;
  font-size: 11px;
  color: var(--mut);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.prof-mini-ranks b { color: var(--ink-strong); font-weight: 600; }

.drawer-toggle-btn {
  background: var(--surface);
  color: var(--cy);
  border: 1px solid var(--line-gold);
  padding: 6px 9px;
  font: 600 11px 'Inter', sans-serif;
  border-radius: 4px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  white-space: nowrap;
}
.drawer-toggle-btn:hover, .drawer-toggle-btn.open {
  background: color-mix(in srgb, var(--cy) 18%, var(--surface));
  border-color: var(--cy);
}
.drawer-chevron {
  display: inline-block;
  transition: transform 0.25s ease;
}
.drawer-toggle-btn.open .drawer-chevron {
  transform: rotate(180deg);
}

/* COLLAPSIBLE STATUS DRAWER */
.prof-drawer {
  display: none;
  margin-top: 8px;
  padding: 12px;
  background: linear-gradient(180deg, var(--card2), var(--card));
  border: 1px solid var(--line-gold);
  border-radius: 6px;
  box-shadow: var(--shadow-card);
  animation: slideDown 0.22s ease-out;
}
.prof-drawer.open { display: block; }
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
.drawer-meta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
}
.medals-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.medal-mini {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  position: relative;
}
.rk-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
}
.rk-cell {
  position: relative;
  padding: 11px 13px;
  background: linear-gradient(180deg, var(--card2), var(--surface));
  border: 1px solid var(--line);
  border-top: 3px solid var(--rc, #7f8b99);
  overflow: hidden;
  cursor: pointer;
}
.rk-cell:hover { border-color: var(--rc); }
.rk-cell .rk-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--mut);
  margin-bottom: 4px;
}
.rk-cell .rk-badge {
  padding: 2px 7px;
  font-weight: 700;
  font-size: 10.5px;
  color: #ffffff;
  background: var(--rc);
  border-radius: 2px;
}
.rk-cell .rk-name {
  font-size: 17px;
  color: var(--rc);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  text-transform: uppercase;
}
.rk-xp {
  height: 6px;
  background: var(--surface);
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 3px;
}
.rk-xp i {
  display: block;
  height: 100%;
  background: var(--rc);
  transition: width 0.4s ease;
}
.rk-sub {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--mut);
  margin-top: 5px;
}

/* RARITY COLORS */
.rar-0 { --rc: #786e62; }
.rar-1 { --rc: #3d8c57; }
.rar-2 { --rc: #2f77a8; }
.rar-3 { --rc: #8244bd; }
.rar-4 { --rc: #b8292f; }
.rar-5 { --rc: #c96218; border-image: linear-gradient(90deg, #b8292f, #d49b4b, #ff6b2b, #8c52b5) 1; }
.rar-5 .rk-badge, .rar-5 .rk-xp i {
  background: linear-gradient(90deg, #b8292f, #c96218, #b37d14, #7c3aed);
  background-size: 200% 100%;
  animation: shine 2.8s linear infinite;
  color: #fff;
}
.rar-6 { --rc: #c9971c; border-color: #c9971c; }
.rar-6 .rk-badge, .rar-6 .rk-xp i {
  background: linear-gradient(100deg, #78540e, #e6b830, #b8860b, #78540e);
  background-size: 200% 100%;
  animation: shine 1.8s linear infinite;
  color: #fff;
}
[data-theme="dark"] .rar-6 .rk-name { color: #f5d061; text-shadow: 0 0 12px rgba(212, 175, 55, 0.5); }
[data-theme="light"] .rar-6 .rk-name { color: #8a5a00; }
[data-theme="light"] .rar-0 { --rc: #5c5349; }
[data-theme="light"] .rar-1 { --rc: #1e6b3a; }
[data-theme="light"] .rar-2 { --rc: #1c5882; }
[data-theme="light"] .rar-3 { --rc: #5e2594; }
[data-theme="light"] .rar-4 { --rc: #9c1920; }
[data-theme="light"] .rar-5 { --rc: #9e4308; }
@keyframes shine { to { background-position: -200% 0; } }

/* ==========================================================================
   STICKY HORIZONTAL SWIPEABLE TABS BAR
   ========================================================================== */
.tabs {
  position: sticky;
  top: 0;
  z-index: 25;
  display: flex;
  gap: 6px;
  margin: 0 -12px 12px;
  padding: 7px 12px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  flex-wrap: nowrap;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  padding: 7px 12px;
  background: linear-gradient(180deg, var(--card2), var(--card));
  color: var(--mut);
  border: 1px solid var(--line);
  font-size: 13.5px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  text-transform: uppercase;
  white-space: nowrap;
}
.tab.on {
  background: linear-gradient(180deg, color-mix(in srgb, var(--cy) 24%, var(--card2)), var(--card));
  color: var(--ink-strong);
  border-color: var(--cy);
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25), inset 0 0 10px color-mix(in srgb, var(--cy) 18%, transparent);
}
.tab.on svg { color: var(--cy); }
.tab:hover:not(.on) {
  color: var(--ink-strong);
  border-color: var(--line-gold);
}

/* CARDS & COMMON UI */
.card {
  background: linear-gradient(180deg, var(--card2), var(--card) 75%);
  padding: 15px;
  margin-bottom: 12px;
  border: 1px solid var(--line);
  border-top: 2px solid var(--line-gold);
  box-shadow: var(--shadow-card);
}
.mut { color: var(--mut); }
h2 {
  font-size: 21px;
  line-height: 1.2;
  margin-bottom: 6px;
  text-transform: uppercase;
  color: var(--ink-strong);
}
h3 {
  font-size: 16.5px;
  margin-bottom: 6px;
  text-transform: uppercase;
  color: var(--cy);
}
.btn {
  background: linear-gradient(180deg, #8f2327, #591215);
  color: #ffffff;
  border: 1px solid #c95156;
  font-size: 14.5px;
  padding: 9px 16px;
  border-radius: 4px;
  cursor: pointer;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  justify-content: center;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.cy {
  background: linear-gradient(180deg, #9c6c25, #694410);
  color: #ffffff;
  border-color: #d49b4b;
}
.btn.gr {
  background: linear-gradient(180deg, #2e6f46, #194228);
  color: #ffffff;
  border-color: #5ec280;
}
.btn.vi {
  background: linear-gradient(180deg, #5e3280, #381a4f);
  color: #ffffff;
  border-color: #9b62c7;
}
.btn.ye {
  background: linear-gradient(180deg, #b06e12, #734405);
  color: #ffffff;
  border-color: #eba43d;
}
.btn.gh {
  background: var(--surface);
  color: var(--ink-strong);
  border: 1px solid var(--line);
  font-size: 13px;
  padding: 7px 12px;
  box-shadow: none;
}
.btn.gh:hover:not(:disabled) { border-color: var(--cy); color: var(--cy); }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 9px 0; }
.chip {
  background: var(--surface);
  color: var(--ink-strong);
  border: 1px solid var(--line);
  padding: 7px 12px;
  font-size: 13.5px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chip:hover { border-color: var(--line-gold); }
.chip.on {
  border-color: var(--cy);
  color: var(--cy);
  background: color-mix(in srgb, var(--cy) 15%, var(--surface));
  box-shadow: inset 0 0 10px color-mix(in srgb, var(--cy) 22%, transparent);
}

input[type=number], input[type=text], select {
  background: var(--surface);
  border: 1px solid var(--line-gold);
  color: var(--ink-strong);
  padding: 8px 10px;
  font: 500 14.5px 'Inter', sans-serif;
  border-radius: 4px;
  max-width: 100%;
}
input[type=number] { width: 105px; }
input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--cy); outline-offset: 1px; }
.kv { margin: 9px 0; color: var(--mut); font-size: 13.5px; }
.kv b { color: var(--cy); font-size: 21px; margin-left: 6px; }
.hud { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.hud b { display: block; font-size: 20px; color: var(--ink-strong); }
.bar {
  position: relative;
  height: 12px;
  background: var(--surface);
  border: 1px solid var(--line-gold);
  margin: 10px 0 14px;
  border-radius: 3px;
}
.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--red), var(--cy));
  transition: width 0.5s;
}
.bar em {
  position: absolute;
  right: -6px;
  top: -13px;
  font-style: normal;
  color: var(--cy);
  line-height: 0;
}

/* ==========================================================================
   CLEAN, UNCLUTTERED START HUB SCREEN
   ========================================================================== */
.hero {
  text-align: center;
  padding: 0 0 14px 0;
  overflow: hidden;
  border-top: 2px solid var(--cy);
}
.souls-scene {
  position: relative;
  width: 100%;
  height: 125px;
  background: #080605;
  border-bottom: 1px solid var(--line-gold);
  overflow: hidden;
}
[data-theme="light"] .souls-scene { background: #d8d5ce; }
.souls-scene-photo {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center 35%;
  opacity: 0.38;
  mix-blend-mode: screen;
  filter: contrast(1.15) saturate(0.85);
  pointer-events: none;
}
[data-theme="dark"] .souls-scene-photo {
  background-image: url('https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=1400&q=80');
}
[data-theme="light"] .souls-scene-photo {
  background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1400&q=80');

}
#hero-canvas {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}
.scene-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  background: linear-gradient(180deg, transparent 35%, var(--card2) 100%);
  pointer-events: none;
}
.scene-caption {
  position: relative;
  z-index: 3;
  margin-top: -22px;
  padding: 0 12px;
}
.hero-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 10px;
  padding: 0 12px;
  text-align: left;
}
.hub-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--c, var(--cy));
  padding: 11px 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;

}
.hub-card:hover {
  transform: translateY(-2px);

}
.hub-card h3 { color: var(--c, var(--cy)); margin: 0; font-size: 16.5px; display: flex; align-items: center; gap: 6px; }
.hub-card p { font-size: 12px; color: var(--mut); line-height: 1.35; }
.hub-stat {

}

/* 10 DARK SOULS GOTHIC DOORS & FOG GATES */
.doors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.door {
  --c: var(--cy);
  --dc: var(--c);
  background: linear-gradient(180deg, var(--card2), var(--surface));
  border: 1px solid var(--line);
  border-bottom: 3px solid var(--dc);
  padding: 13px;
  cursor: pointer;
  color: var(--ink);
  font: inherit;
  text-align: center;
  position: relative;
}
[data-theme="light"] .door { --dc: color-mix(in srgb, var(--c) 72%, #1a120b); }
.door:hover:not(.open) {
  transform: translateY(-3px);
  border-color: var(--dc);
  box-shadow: var(--shadow-card);
}
.door.scout-target {
  outline: 2px dashed var(--cy);
  animation: pulse 1.2s infinite;
}
.door.dim { opacity: 0.35; pointer-events: none; }
.risk-pill {
  display: inline-block;
  font-size: 11px;
  padding: 2px 9px;
  background: var(--card);
  color: var(--dc);
  border: 1px solid color-mix(in srgb, var(--dc) 55%, transparent);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 700;
}
.scout-badge {
  background: linear-gradient(90deg, #1b4d3e, #2e7d4c);
  color: #fff;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 8px;
  margin-bottom: 6px;
  border: 1px solid #6bc289;
  display: block;
}
.nm { font-size: 18px; color: var(--dc); min-height: 24px; }
.frame {
  height: 132px;
  background: #040303;
  position: relative;
  perspective: 650px;
  margin: 6px auto 10px;
  width: 106px;
  border: 5px solid #2e2925;
  border-bottom-width: 6px;
  border-radius: 62px 62px 2px 2px;
  overflow: hidden;
  box-shadow: 0 0 0 1px #594b3b, inset 0 0 22px #000;
}
.frame:before {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 50%;
  background: linear-gradient(0deg, var(--c), transparent);
  opacity: 0.3;
  animation: fl 2.4s ease-in-out infinite alternate;
  z-index: 1;
  pointer-events: none;
}
@keyframes fl { to { opacity: 0.7; } }
.glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 62%, #fff5d6, var(--c) 45%, transparent 76%);
  opacity: 0;
  transition: opacity 0.75s;
}
.panel {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: inset 0 0 32px #000e, inset -6px 0 14px #000b;
}
.panel:before, .panel:after { content: ""; position: absolute; pointer-events: none; }
.panel:before {
  inset: 4px;
  border: 1px solid rgba(255, 235, 190, 0.16);
  border-radius: 54px 54px 0 0;
  background: linear-gradient(90deg, transparent 48%, rgba(0,0,0,0.75) 49%, rgba(255,255,255,0.08) 51%, transparent 52%);
}
.open .panel { transform: rotateY(-84deg); }
.open .glow { opacity: 1; }

/* 10 DARK SOULS GOTHIC DOOR DESIGNS (p0..p9) */
.panel.p0 {
  background:
    radial-gradient(circle at 50% 34%, rgba(255, 215, 110, 0.55) 0 18px, transparent 34px),
    repeating-linear-gradient(90deg, #3b2d1d 0 12px, #261c11 12px 14px),
    linear-gradient(180deg, #523e27, #24190e);
}
.panel.p0:after {
  left: 50%; top: 34%; width: 36px; height: 36px; margin: -18px;
  border: 2px solid #e6c165; border-radius: 50%;
  background: radial-gradient(circle, #ffe89e 0 5px, transparent 6px),
              repeating-conic-gradient(#e6c165 0 10deg, transparent 10deg 30deg);
  box-shadow: 0 0 16px #e6c165;
}
.panel.p1 {
  background:
    radial-gradient(circle at 50% 45%, rgba(79, 209, 176, 0.28), transparent 55%),
    repeating-linear-gradient(0deg, #1b2822 0 16px, #101814 16px 19px),
    linear-gradient(180deg, #24382f, #0d1411);
}
.panel.p1:after {
  left: 50%; top: 45%; width: 32px; height: 46px; margin: -23px -16px;
  border: 2px solid #5ec29e; border-radius: 18px 18px 2px 2px;
  box-shadow: 0 0 14px #5ec29e, inset 0 0 10px #5ec29e;
}
.panel.p2 {
  background:
    linear-gradient(0deg, transparent 18%, #1c130c 18% 25%, transparent 25% 72%, #1c130c 72% 79%, transparent 79%),
    repeating-linear-gradient(90deg, #422916 0 14px, #29180b 14px 16px);
}
.panel.p2:after {
  left: 50%; top: 48%; width: 28px; height: 40px; margin: -20px -14px;
  border: 2px solid #cfa055;

  box-shadow: 0 0 12px rgba(207, 160, 85, 0.5);
}
.panel.p3 {
  background:
    repeating-linear-gradient(90deg, transparent 0 14px, #14171a 14px 18px),

    linear-gradient(180deg, #32383e, #16191c);
}
.panel.p3:after {
  left: 50%; top: 48%; width: 38px; height: 38px; margin: -19px;
  border: 4px dashed #d47a35; border-radius: 50%;
  background: radial-gradient(circle, #ff9947 0 6px, #1a1d20 7px);
  box-shadow: 0 0 14px rgba(212, 122, 53, 0.7);
}
.panel.p4 {
  background:
    radial-gradient(ellipse at 50% 55%, rgba(165, 215, 255, 0.45), transparent 65%),
    repeating-linear-gradient(125deg, #1b2838 0 12px, #24374d 12px 24px);
}
.panel.p4:after {
  left: 50%; top: 46%; width: 34px; height: 52px; margin: -26px -17px;
  border: 2px solid #99d6ff; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.65), rgba(100,180,255,0.2) 60%, transparent 70%);
  box-shadow: 0 0 18px #66b8ff;
}
.panel.p5 {
  background:
    radial-gradient(circle at 50% 65%, rgba(154, 111, 224, 0.35), transparent 55%),

}
.panel.p5:after {
  left: 50%; top: 48%; width: 36px; height: 36px; margin: -18px;
  border-radius: 50%; border: 2px solid #b57cff;
  background: radial-gradient(circle, #e0c2ff 0 5px, transparent 6px 11px, #b57cff 12px 13px, transparent 14px);
  box-shadow: 0 0 18px #9a5cff;
}
.panel.p6 {
  background:
    repeating-linear-gradient(0deg, #09080a 0 2px, transparent 2px 28px),

}
.panel.p6:after {
  left: 50%; top: 44%; width: 32px; height: 32px; margin: -16px;
  transform: rotate(45deg); border: 2px solid #d9669f;
  background: radial-gradient(circle, #ffcce6 0 4px, #b83d7a 5px 10px, transparent 11px);
  box-shadow: 0 0 18px #d9669f;
}
.panel.p7 {
  background:
    repeating-linear-gradient(90deg, #1f1b18 0 6px, #2e2622 6px 8px, transparent 8px 18px),
    radial-gradient(ellipse at 50% 88%, #ff5e1a, #4a1404 58%, #0d0806);
}
.panel.p7:after {
  left: 50%; bottom: 16px; width: 30px; height: 30px; margin-left: -15px;
  border-radius: 50%; border: 3px solid #ff7b29;
  background: radial-gradient(circle, #000 0 9px, #ff5500 10px 13px, transparent 14px);
  box-shadow: 0 0 20px #ff5500;
}
.panel.p8 {
  background:
    radial-gradient(circle at 50% 42%, rgba(217, 38, 62, 0.45), transparent 55%),
    repeating-linear-gradient(45deg, #12090b 0 9px, #1f0e13 9px 18px);
}
.panel.p8:after {
  left: 50%; top: 42%; width: 38px; height: 22px; margin: -11px -19px;
  border-radius: 50%; border: 2px solid #e62e45;
  background: radial-gradient(circle, #fff 0 3px, #d91c36 4px 9px, #140004 10px);
  box-shadow: 0 0 22px #e62e45;
}
.panel.p9 {
  background:
    radial-gradient(circle at 50% 46%, #000 0 16px, #ff3b14 17px 21px, rgba(184, 29, 47, 0.4) 28px, #080508 65%);
}
.panel.p9:after {
  left: 50%; top: 46%; width: 42px; height: 42px; margin: -21px;
  border-radius: 50%; border: 2px solid #ff551a;
  box-shadow: 0 0 26px #ff3300, inset 0 0 16px #ff7700;
}

.od {
  display: grid;
  grid-template-columns: 56px 1fr 48px;
  gap: 6px;
  align-items: center;
  font-size: 12.5px;
  font-weight: 500;
  margin-top: 4px;
  text-align: left;
  color: var(--ink-strong);
}
.od u { display: block; height: 6px; background: var(--card); border: 1px solid var(--line); text-decoration: none; border-radius: 2px; overflow: hidden; }
.od u:after { content: ""; display: block; height: 100%; width: var(--w); background: var(--dc); }
.od b { text-align: right; color: var(--ink-strong); font-weight: 700; font-size: 12px; }
.hist { display: flex; align-items: flex-end; gap: 2px; height: 26px; margin: 8px 0 3px; }
.hist i { flex: 1; background: var(--dc); opacity: 0.85; min-height: 2px; }
.hs { font-size: 11.5px; color: var(--mut); text-align: left; }

/* DARKSIGN ECLIPSE TIMER & REVEAL */
.ring {
  --p: 0;
  --c: var(--ember);
  width: 215px;
  height: 215px;
  border-radius: 50%;
  margin: 12px auto;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--line) 0);
  box-shadow: 0 0 28px color-mix(in srgb, var(--c) 40%, transparent);
  animation: pulse 2.4s ease-in-out infinite;
}
.ring > div {
  width: 185px;
  height: 185px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--card) 60%, var(--surface) 100%);
  border: 1px solid var(--line-gold);
  display: grid;
  place-items: center;
  align-content: center;
  text-align: center;
}
.big { font-size: 46px; line-height: 1; font-weight: 700; color: var(--ink-strong); }
.center { text-align: center; }
@keyframes pulse {
  50% { box-shadow: 0 0 42px color-mix(in srgb, var(--c) 60%, transparent); }
}
.pop { text-align: center; animation: pop 0.4s cubic-bezier(0.22, 1, 0.36, 1); position: relative; overflow: hidden; }
.pop > :not(.rays) { position: relative; }
.rays {
  position: absolute !important;
  left: 50%;
  top: 90px;
  width: 480px;
  height: 480px;
  margin: -240px;
  background: repeating-conic-gradient(color-mix(in srgb, var(--t) 22%, transparent) 0 8deg, transparent 8deg 20deg);
  -webkit-mask-image: radial-gradient(circle, #000 5%, transparent 62%);
  mask-image: radial-gradient(circle, #000 5%, transparent 62%);
  animation: spin 20s linear infinite;
  pointer-events: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
.tag {
  display: inline-block;
  padding: 3px 12px;
  font-size: 11.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #ffffff;
  background: var(--t, var(--cy));
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 3px;
  margin: 4px 0 6px;
}
.tag.gold {
  background: linear-gradient(100deg, #8a5a10, #d49b4b, #9c6b19);
  background-size: 200% 100%;
  animation: shine 2.2s linear infinite;
  color: #ffffff;
}

/* STATS, LOGS & GRIDS */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.st {
  background: var(--surface);
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--cy);
  border-radius: 4px;
}
.st span { display: block; color: var(--mut); font-size: 12px; font-weight: 500; margin-bottom: 2px; }
.st b { font-size: 20px; color: var(--ink-strong); }
.st.r { border-left-color: var(--ye); }
.st.v { border-left-color: var(--vi); }
.st.d { border-left-color: var(--red); }
.st.g { border-left-color: var(--gr); }

.log { list-style: none; padding: 0; max-height: 360px; overflow-y: auto; }
.log li {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 4px;
  border-bottom: 1px solid var(--line);
  font-size: 13.5px;
  align-items: center;
}
.log small { color: var(--mut); font-size: 12px; }
.plus { color: var(--gr); font-weight: 700; white-space: nowrap; }
.minus { color: var(--red); font-weight: 700; white-space: nowrap; }

.muscle-bars {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.m-row {
  background: var(--surface);
  padding: 9px 11px;
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.m-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; color: var(--ink-strong); }
.m-bar { height: 6px; background: var(--card); overflow: hidden; border: 1px solid var(--line); border-radius: 3px; }
.m-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--cy)); }

/* ACHIEVEMENTS */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.ach {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 12px;
  display: flex;
  gap: 11px;
  align-items: center;
  position: relative;
}
.ach.t1 { border-color: #9e632b; box-shadow: inset 0 0 16px rgba(205, 127, 50, 0.12); }
.ach.t2 { border-color: #8c52b5; box-shadow: inset 0 0 20px rgba(140, 82, 181, 0.16); }
.ach.t3 { border-color: #c9971c; box-shadow: 0 0 16px rgba(212, 175, 55, 0.22), inset 0 0 24px rgba(212, 175, 55, 0.15); }
.ach-ic {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--card);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  position: relative;
  border: 1.5px solid var(--ac, var(--line));
  color: var(--mut);
}
.ach.t1 .ach-ic { --ac: #b86b23; color: #b86b23; }
.ach.t2 .ach-ic { --ac: #8244bd; color: #8244bd; }
.ach.t3 .ach-ic { --ac: #b8860b; color: #b8860b; }
.ach-body { flex: 1; min-width: 0; }
.ach-lvl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--mut); }
.ach-ttl { font-size: 16.5px; color: var(--ink-strong); margin: 2px 0; text-transform: uppercase; }
.ach-desc { font-size: 12.5px; color: var(--mut); margin-bottom: 6px; line-height: 1.35; }

/* ==========================================================================
   CS2 CASE ROULETTE & SHOP STYLES (WITH GUARDIAN SHOP ITEM BADGES)
   ========================================================================== */
.case-box {
  background: var(--surface);
  border: 2px solid var(--line-gold);
  padding: 14px;
  margin: 12px 0;
  position: relative;
  overflow: hidden;
}
.roulette-viewport {
  position: relative;
  width: 100%;
  height: 118px;
  background: #070605;
  border: 2px solid var(--line-gold);
  overflow: hidden;
  margin: 10px 0;
  box-shadow: inset 0 0 28px #000;
}
.roulette-marker {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 3px;
  background: #ff3b30;
  z-index: 5;
  transform: translateX(-50%);
  box-shadow: 0 0 12px #ff3b30;
}
.roulette-marker::before,
.roulette-marker::after {
  content: "";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
}
.roulette-marker::before { top: 0; border-top: 10px solid #ff3b30; }
.roulette-marker::after { bottom: 0; border-bottom: 10px solid #ff3b30; }
.roulette-track {
  display: flex;
  gap: 8px;
  padding: 10px;
  height: 100%;
  align-items: center;
  will-change: transform;
}
.r-card {
  width: 128px;
  height: 94px;
  flex-shrink: 0;
  background: linear-gradient(180deg, #1e1916, #0e0c0a);
  border: 1px solid #3a3128;
  border-bottom: 4px solid var(--rc, #d49b4b);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px;
  text-align: center;
  color: #f4ece1;
}
.r-card b { font-size: 12.5px; margin-top: 5px; line-height: 1.15; }
.shop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.shop-item {
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 3px solid var(--rc, var(--cy));
  padding: 13px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  transition: transform 0.18s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.shop-item:hover {
  transform: translateY(-2px);
  border-color: var(--rc, var(--cy));
  box-shadow: var(--shadow-card);
}
.shop-item-top {
  display: flex;
  gap: 11px;
  align-items: flex-start;
}
.shop-ic-badge {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--rc) 28%, var(--card2)), var(--card));
  border: 1.5px solid color-mix(in srgb, var(--rc) 65%, transparent);
  color: var(--rc);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  box-shadow: 0 4px 12px color-mix(in srgb, var(--rc) 20%, transparent);
}
.inv-bar {
  background: var(--surface);
  border: 1px solid var(--line-gold);
  padding: 10px 12px;
  margin-bottom: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

/* ==========================================================================
   FULL-WIDTH GITHUB HEATMAP (FITS SCREEN WITHOUT HORIZONTAL SCROLL), CHARTS & QUESTS
   ========================================================================== */
.heatmap-wrap {
  width: 100%;
  padding: 6px 0;
  overflow: hidden;
}
.heatmap {
  display: grid;
  grid-template-columns: repeat(20, minmax(0, 1fr));
  grid-template-rows: repeat(7, auto);
  grid-auto-flow: column;
  gap: 3px;
  width: 100%;
}
.hm-cell {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 2px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.hm-legend-cell {
  width: 12px;
  height: 12px;
  display: inline-block;
  vertical-align: middle;
  border-radius: 2px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.hm-cell.l1, .hm-legend-cell.l1 { background: #4a3519; border-color: #694b23; }
.hm-cell.l2, .hm-legend-cell.l2 { background: #7d5722; border-color: #9e6e2b; }
.hm-cell.l3, .hm-legend-cell.l3 { background: #b57c29; border-color: #d49b4b; }
.hm-cell.l4, .hm-legend-cell.l4 { background: #f2aa3c; border-color: #ffd27d; box-shadow: 0 0 5px rgba(242, 170, 60, 0.45); }
[data-theme="light"] .hm-cell.l1, [data-theme="light"] .hm-legend-cell.l1 { background: #d6c4a5; }
[data-theme="light"] .hm-cell.l2, [data-theme="light"] .hm-legend-cell.l2 { background: #b89760; }
[data-theme="light"] .hm-cell.l3, [data-theme="light"] .hm-legend-cell.l3 { background: #966c28; }
[data-theme="light"] .hm-cell.l4, [data-theme="light"] .hm-legend-cell.l4 { background: #694408; }

.chart-bars {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 150px;

/* ==========================================================================
   30-DAY STREAK PROGRESSION: 1% ON DAY 1 -> 10% ON DAY 30, KEYS ON NON-UP DAYS
   ========================================================================== */
const STREAK_UP_DAYS=[1,4,7,10,13,17,20,24,27,30];
function getStreakBonusPctForDay(day){
  if(!day||day<=0)return 0;
  let pct=0;
  for(const d of STREAK_UP_DAYS){
    if(day>=d)pct++;
  }
  return Math.min(10,pct);
}
function isStreakPctUpgradeDay(day){
  return STREAK_UP_DAYS.includes(day);
}
function getStreakMult(){
  const pct=getStreakBonusPctForDay(S.streak.cur||0);
  return 1+(pct/100);
}

/* DATE & WEEK KEYS */
const toDayKey=ts=>{
  const d=new Date(ts||Date.now());
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const toWeekKey=ts=>{
  const d=new Date(ts||Date.now());
  const day=(d.getDay()+6)%7;
  const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);
  return toDayKey(mon.getTime());
};

function normalizeState(rawObj){
  const b=DEF();
  const s=Object.assign(b,rawObj||{});
  s.profile=Object.assign(b.profile,s.profile||{});
  s.cfg=Object.assign(b.cfg,s.cfg||{});
  if(!s.cfg.doors||s.cfg.doors.length!==10)s.cfg.doors=JSON.parse(JSON.stringify(DEF_DOORS));
  s.bank=Object.assign(b.bank,s.bank||{});
  s.stats=Object.assign(b.stats,s.stats||{});
  s.stats.muscles=Object.assign({},s.stats.muscles||{});
  s.stats.customActs=Object.assign({},s.stats.customActs||{});
  s.inv=Object.assign(b.inv,s.inv||{});
  s.buffs=Object.assign(b.buffs,s.buffs||{});
  s.shop=Object.assign(b.shop,s.shop||{});
  s.streak=Object.assign(b.streak,s.streak||{});
  s.daily=Object.assign({},s.daily||{});
  if(!Array.isArray(s.hours)||s.hours.length!==24)s.hours=Array(24).fill(0);
  s.quests=Object.assign(b.quests,s.quests||{});
  s.quests.claimed=Object.assign({},s.quests.claimed||{});
  s.weeklyPlan=Object.assign(b.weeklyPlan,s.weeklyPlan||{});
  s.gym=Object.assign(b.gym,s.gym||{});

  if(!Array.isArray(s.bodyMetrics))s.bodyMetrics=[];
  s.wkForm=Object.assign(b.wkForm,s.wkForm||{});
  if(!s.theme)s.theme='dark';
  return s;
}

    const res=await fetch(`${BACKEND_URL}/api/load`,{

/* CHECK & UPDATE STREAK AND QUEST RESETS */
function syncCalendarState(){
  const today=toDayKey();
  const curWeek=toWeekKey();
  if(S.quests.dayKey!==today){
    S.quests.dayKey=today;
    S.quests.miniDone=false;
    Object.keys(S.quests.claimed).forEach(k=>{if(k.startsWith('d_'))delete S.quests.claimed[k]});
  }
  if(S.quests.weekKey!==curWeek){
    S.quests.weekKey=curWeek;
    Object.keys(S.quests.claimed).forEach(k=>{if(k.startsWith('w_'))delete S.quests.claimed[k]});
  }
  if(S.weeklyPlan.weekKey!==curWeek){
    S.weeklyPlan.weekKey=curWeek;
    S.weeklyPlan.created=false;
    S.weeklyPlan.creationBonusPaid=false;
    S.weeklyPlan.completedPaid=false;
  }
  if(S.streak.lastDate&&S.streak.lastDate!==today){
    const d1=new Date(S.streak.lastDate+'T00:00:00');
    const d2=new Date(today+'T00:00:00');
    const diffDays=Math.round((d2-d1)/86400000);
    if(diffDays>1){
      const missed=diffDays-1;
      if((S.inv.freeze||0)>=missed&&S.streak.cur>0){
        S.inv.freeze-=missed;
        S.streak.frozenUsed=(S.streak.frozenUsed||0)+missed;
        S.streak.lastDate=toDayKey(d2.getTime()-86400000);
      }else{
        S.streak.cur=0;
      }
    }
  }
}
syncCalendarState();

function recordDailyActivity(studyMin=0,workouts=0,doorsOpened=0){
  syncCalendarState();
  const today=toDayKey();
  if(!S.daily[today])S.daily[today]={min:0,wk:0,doors:0};
  S.daily[today].min+=studyMin;
  S.daily[today].wk+=workouts;
  S.daily[today].doors+=doorsOpened;

  if(studyMin>0||workouts>0){
    const hr=new Date().getHours();
    S.hours[hr]=(S.hours[hr]||0)+(studyMin>0?studyMin:30);
    if(S.streak.lastDate!==today){
      S.streak.cur=(S.streak.cur||0)+1;
      if(S.streak.cur>(S.streak.best||0))S.streak.best=S.streak.cur;
      S.streak.lastDate=today;
      const newDay=S.streak.cur;
      /* On days where bonus % does not increase (or after day 30), grant 1 Key */
      if(!isStreakPctUpgradeDay(newDay)){
        S.stats.keys=(S.stats.keys||0)+1;
        S.stats.keyBalance=(S.stats.keyBalance||0)+1;
        addBankLog(`🔥 Серия ${newDay} дн.: получен бонусный 🔑 Ключ за постоянство!`,0);
      }else{
        const newPct=getStreakBonusPctForDay(newDay);
        addBankLog(`🔥 Серия ${newDay} дн.: бонус к наградам вырос до +${newPct}%!`,0);
      }
    }
  }
  checkWeeklyPlanCompletion();
}

function getWeekProgress(weekMondayStr){
  const mon=new Date((weekMondayStr||toWeekKey())+'T00:00:00');
  let min=0,wk=0,days=0;
  for(let i=0;i<7;i++){
    const k=toDayKey(mon.getTime()+i*86400000);
    const d=S.daily[k];
    if(d){
      min+=d.min||0;
      wk+=d.wk||0;
      if((d.min||0)>0||(d.wk||0)>0)days++;
    }
  }
  return {min,wk,days};
}

function checkWeeklyPlanCompletion(){
  const wp=S.weeklyPlan;
  if(!wp.created||wp.completedPaid)return;
  const prog=getWeekProgress(wp.weekKey);
  if(prog.min>=wp.studyHrs*60&&prog.wk>=wp.workouts){
    wp.completedPaid=true;
    const bonus=1500;
    S.bank.pend+=bonus;
    S.stats.totalEarned=(S.stats.totalEarned||0)+bonus;
    S.stats.keyBalance=(S.stats.keyBalance||0)+1;
    addBankLog('Бонус за полное выполнение недельного плана! (+1 Ключ)',bonus);
  }
}

/* DARK SOULS ATMOSPHERIC SOUND ENGINE */
let AC=null;
const tone=(f,t,d,ty='sine',v=.16,f2)=>{
  const c=AC,o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t;
  o.type=ty;o.frequency.setValueAtTime(f,n);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
  g.gain.setValueAtTime(0.0001,n);
  g.gain.linearRampToValueAtTime(v,n+.025);
  g.gain.exponentialRampToValueAtTime(.0008,n+d);
  o.connect(g);g.connect(c.destination);
  o.start(n);o.stop(n+d+.06);
};
const bell=(f,t,d,v=.12)=>{
  tone(f,t,d,'sine',v);
  tone(f*2,t,d*.75,'sine',v*.45);
  tone(f*2.4,t,d*.55,'triangle',v*.25);
  tone(f*.5,t,d*1.1,'sine',v*.6);
};
const noise=(t,d,f,q,v,ty='bandpass')=>{
  const c=AC,n=c.currentTime+t,b=c.createBuffer(1,Math.ceil(c.sampleRate*d),c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
  s.buffer=b;fl.type=ty;fl.frequency.value=f;fl.Q.value=q;
  g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
  s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(n);
};

const DUR=[10,15,20,25,30,35,40,45,50,55,60];
const dw=(c,d)=>Math.exp(-((d-c)**2)/242);
const hm=n=>{const h=Math.floor(n/60),m=Math.round(n%60);return h?h+' ч'+(m?' '+m+' мин':''):m+' мин'};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

function pickDur(c,rem){
  const ds=DUR.filter(d=>d<=rem);
  if(!ds.length)return rem;
  let x=Math.random()*ds.reduce((a,d)=>a+dw(c,d),0),p=ds[ds.length-1];
  for(const d of ds){x-=dw(c,d);if(x<=0){p=d;break}}
  return rem-p<10&&rem<=60?rem:p;
}

/* EFFECTIVE DOOR CHANCES */
function getDoorOdds(door,step=0){
  const canKey=step>=3;
  const streakPen=Math.pow(0.5,S.stats.earlyStreak||0);
  let k=canKey?+(door.k*(S.cfg.kMult||1)*streakPen).toFixed(2):0;
  let g=+(door.g*(S.cfg.gMult||1)).toFixed(2);
  let r=+(door.r*(S.cfg.rMult||1)).toFixed(1);
  if(k+g+r>95){const sc=95/(k+g+r);k=+(k*sc).toFixed(2);g=+(g*sc).toFixed(2);r=+(r*sc).toFixed(1);}
  const s=+(100-k-g-r).toFixed(1);
  return {s,r,g,k,canKey,streakPen};
}

function pickDoors(){
  const pool=S.cfg.doors.slice().sort(()=>Math.random()-.5).slice(0,3);
  return pool.sort((a,b)=>(a.k+a.g)-(b.k+b.g)||a.c-b.c);
}

/* ROLL A SINGLE DOOR OUTCOME (USED BY BOTH SCOUT & OPEN DOOR) */
function rollDoorOutcome(d,step,rem){
  const od=getDoorOdds(d,step);
  const x=Math.random()*100;
  const type=x<od.k?'key':x<od.k+od.g?'game':x<od.k+od.g+od.r?'rest':'focus';
  let dur=0;
  let note='';
  if(type==='rest'){
    if(S.buffs.breather){
      dur=15;
      S.buffs.breather=false;
      note='💨 Сработала «Передышка»: гарантированный отдых 15 минут!';
    }else{
      dur=5*rnd(1,3);
    }
  }else if(type==='focus'){
    dur=pickDur(d.c,rem);
  }
  const t=tier(type,dur);
  return {type,dur,t,note};
}

function calcRank(list,val){
  let lvl=0;
  for(let i=0;i<list.length;i++){if(val>=list[i][0])lvl=i;}
  const curReq=list[lvl][0];
  const nextReq=lvl<list.length-1?list[lvl+1][0]:curReq;
  const pct=lvl>=list.length-1?100:Math.max(0,Math.min(100,((val-curReq)/(nextReq-curReq))*100));
  const rar=getRarityIdx(lvl);
  return {lvl,name:list[lvl][1],curReq,nextReq,pct,rar,rarName:RARITY_NAMES[rar],max:lvl>=list.length-1};
}

      <div class="prof-drawer ${profDrawerOpen?'open':''}">

          <div>
            <span class="prof-title">${S.profile.title}</span>

    ['bank','Банк и План','bank']

/* ==========================================================================
   REALISTIC PAINTERLY DARK SOULS HERO RENDERER
   ========================================================================== */
function drawHeroArt(){
  const cv=$('#hero-canvas');
  if(!cv)return;
  const ctx=cv.getContext('2d');
  const W=cv.width=1200, H=cv.height=360;
  const isLight=S.theme==='light';

  let seed=1337;
  const rand=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};

  const sky=ctx.createLinearGradient(0,0,0,H);
  if(isLight){
    sky.addColorStop(0,'#8c8982');
    sky.addColorStop(0.45,'#c4c1ba');
    sky.addColorStop(0.82,'#e2dfd9');
    sky.addColorStop(1,'#f7f4ee');
  }else{
    sky.addColorStop(0,'#040304');
    sky.addColorStop(0.38,'#1c0905');
    sky.addColorStop(0.72,'#4a1608');
    sky.addColorStop(1,'#140d0a');
  }
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<75;i++){
    const cx=rand()*W, cy=rand()*H*0.82, rx=90+rand()*220, ry=24+rand()*55;
    const cg=ctx.createRadialGradient(cx,cy,5,cx,cy,rx);
    if(isLight){
      const v=i%2===0?250:155;
      cg.addColorStop(0,`rgba(${v},${v-2},${v-5},${0.11+rand()*0.12})`);
      cg.addColorStop(1,'rgba(210,206,198,0)');
    }else{
      const dist=Math.hypot(cx-560,cy-105);
      const warm=dist<340;
      cg.addColorStop(0,warm?`rgba(255,${95+Math.floor(rand()*70)},20,${0.08+rand()*0.11})`:`rgba(18,10,9,${0.25+rand()*0.25})`);
      cg.addColorStop(1,'rgba(0,0,0,0)');
    }
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(1,ry/rx);
    ctx.fillStyle=cg;
    ctx.beginPath();ctx.arc(0,0,rx,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  const ex=560, ey=96, er=44;
  if(!isLight){
    const blaze=ctx.createRadialGradient(ex,ey+85,10,ex,ey+40,360);
    blaze.addColorStop(0,'rgba(255,165,60,0.55)');
    blaze.addColorStop(0.3,'rgba(235,68,15,0.32)');
    blaze.addColorStop(0.65,'rgba(120,20,10,0.12)');
    blaze.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=blaze;
    ctx.fillRect(0,0,W,H);

    const cor=ctx.createRadialGradient(ex,ey,er*0.88,ex,ey,er*3.4);
    cor.addColorStop(0,'rgba(255,240,180,0.95)');
    cor.addColorStop(0.14,'rgba(255,120,20,0.88)');
    cor.addColorStop(0.38,'rgba(210,35,10,0.35)');
    cor.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=cor;
    ctx.beginPath();ctx.arc(ex,ey,er*3.4,0,Math.PI*2);ctx.fill();

    for(let a=0;a<180;a++){
      const ang=(a/180)*Math.PI*2;
      const len=er*(1.04+0.32*Math.pow(rand(),2.2));
      const x1=ex+Math.cos(ang)*(er-2), y1=ey+Math.sin(ang)*(er-2);
      const x2=ex+Math.cos(ang+0.04)*len, y2=ey+Math.sin(ang+0.04)*len;
      ctx.strokeStyle=a%3===0?'rgba(255,230,150,0.75)':'rgba(255,85,15,0.55)';
      ctx.lineWidth=1.2+rand()*2.2;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }

    const drip=ctx.createLinearGradient(ex,ey+er,ex,ey+er+110);
    drip.addColorStop(0,'rgba(255,190,90,0.9)');
    drip.addColorStop(0.45,'rgba(255,75,15,0.55)');
    drip.addColorStop(1,'rgba(255,40,0,0)');
    ctx.strokeStyle=drip;
    ctx.lineWidth=2.6;
    ctx.beginPath();ctx.moveTo(ex-1,ey+er);ctx.quadraticCurveTo(ex+3,ey+er+55,ex-2,ey+er+105);ctx.stroke();

    const core=ctx.createRadialGradient(ex,ey,er*0.2,ex,ey,er);
    core.addColorStop(0,'#020101');
    core.addColorStop(0.86,'#070302');
    core.addColorStop(1,'#2e0902');
    ctx.fillStyle=core;
    ctx.beginPath();ctx.arc(ex,ey,er,0,Math.PI*2);ctx.fill();
  }else{
    const halo=ctx.createRadialGradient(ex-80,ey+15,er*0.5,ex-80,ey+15,er*4.5);
    halo.addColorStop(0,'rgba(255,255,255,0.95)');
    halo.addColorStop(0.35,'rgba(240,238,232,0.55)');
    halo.addColorStop(1,'rgba(200,196,188,0)');
    ctx.fillStyle=halo;
    ctx.beginPath();ctx.arc(ex-80,ey+15,er*4.5,0,Math.PI*2);ctx.fill();

    ctx.strokeStyle='rgba(90,85,78,0.28)';
    ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(ex-80,ey+15,er*1.05,0,Math.PI*2);ctx.stroke();

    ctx.fillStyle='rgba(150,146,138,0.42)';
    const bx=980, by=245;
    const spires=[[0,75,16],[22,105,20],[48,142,24],[78,95,18],[102,68,14],[-26,60,15]];
    spires.forEach(([dx,h,w])=>{
      ctx.beginPath();
      ctx.moveTo(bx+dx,by);
      ctx.lineTo(bx+dx,by-h*0.65);
      ctx.lineTo(bx+dx+w/2,by-h);
      ctx.lineTo(bx+dx+w,by-h*0.65);
      ctx.lineTo(bx+dx+w,by);
      ctx.closePath();
      ctx.fill();
    });
  }

  function drawMountainLayer(yBase,amp,roughness,colTop,colBot,rimCol){
    const pts=[];
    for(let x=0;x<=W;x+=15){
      const valley=Math.exp(-Math.pow((x-560)/250,2))*75;
      const n=Math.sin(x*0.005+roughness)*amp*0.5+Math.cos(x*0.017-roughness)*amp*0.3+(rand()-0.5)*amp*0.35;
      pts.push([x,yBase+valley-Math.abs(n)]);
    }
    const mg=ctx.createLinearGradient(0,yBase-amp,0,H);
    mg.addColorStop(0,colTop);
    mg.addColorStop(1,colBot);
    ctx.fillStyle=mg;
    ctx.beginPath();
    ctx.moveTo(0,H);
    pts.forEach(([x,y])=>ctx.lineTo(x,y));
    ctx.lineTo(W,H);
    ctx.closePath();
    ctx.fill();

    if(rimCol){
      ctx.strokeStyle=rimCol;
      ctx.lineWidth=1.4;
      ctx.beginPath();
      pts.forEach(([x,y],idx)=>idx?ctx.lineTo(x,y):ctx.moveTo(x,y));
      ctx.stroke();
    }
  }

  if(!isLight){
    drawMountainLayer(215,95,1.2,'#240e08','#0a0605','rgba(255,115,40,0.28)');
    drawMountainLayer(255,75,2.7,'#170a07','#060404','rgba(255,90,25,0.18)');
  }else{
    drawMountainLayer(225,70,1.5,'rgba(165,160,152,0.55)','rgba(215,212,205,0.85)',null);
    drawMountainLayer(265,55,3.1,'rgba(125,120,112,0.65)','rgba(195,190,182,0.9)',null);
  }

  function drawTreeBranch(x,y,len,ang,w,depth){
    if(depth<=0||w<0.4)return;
    const nx=x+Math.cos(ang)*len;
    const ny=y+Math.sin(ang)*len;
    const cx=(x+nx)/2+(rand()-0.5)*len*0.28;
    const cy=(y+ny)/2+(rand()-0.5)*len*0.28;

    ctx.strokeStyle=isLight?`rgba(42,39,36,${0.55+depth*0.05})`:'#090605';
    ctx.lineWidth=w;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.quadraticCurveTo(cx,cy,nx,ny);
    ctx.stroke();

    if(!isLight&&depth>3){
      ctx.strokeStyle='rgba(255,110,35,0.22)';
      ctx.lineWidth=Math.max(0.8,w*0.22);
      ctx.beginPath();
      ctx.moveTo(x+w*0.35,y);
      ctx.quadraticCurveTo(cx+w*0.35,cy,nx+w*0.25,ny);
      ctx.stroke();
    }

    const sub=depth>6?2:rand()>0.32?2:3;
    for(let i=0;i<sub;i++){
      const spread=(i-(sub-1)/2)*(0.42+rand()*0.28)+(rand()-0.5)*0.18;
      drawTreeBranch(nx,ny,len*(0.72+rand()*0.14),ang+spread,w*(0.65+rand()*0.08),depth-1);
    }
  }
  drawTreeBranch(185,325,58,-Math.PI/2+0.12,22,9);
  drawTreeBranch(185,315,45,Math.PI*0.78,12,4);
  drawTreeBranch(192,315,48,Math.PI*0.22,12,4);

  const fg=ctx.createLinearGradient(0,275,0,H);
  if(isLight){
    fg.addColorStop(0,'rgba(95,90,82,0.75)');
    fg.addColorStop(1,'#f7f4ee');
  }else{
    fg.addColorStop(0,'#120a07');
    fg.addColorStop(1,'#080605');
  }
  ctx.fillStyle=fg;
  ctx.beginPath();
  ctx.moveTo(0,285);
  for(let x=0;x<=W;x+=20){
    ctx.lineTo(x,290+Math.sin(x*0.012)*14+(rand()-0.5)*8);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

  if(!isLight){
    for(let i=0;i<28;i++){
      const lx=45+rand()*260, ly=292+rand()*45, lr=2+rand()*6;
      const lg=ctx.createRadialGradient(lx,ly,0.5,lx,ly,lr*3);
      lg.addColorStop(0,'rgba(255,210,90,0.95)');
      lg.addColorStop(0.4,'rgba(255,80,10,0.65)');
      lg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=lg;
      ctx.beginPath();ctx.arc(lx,ly,lr*3,0,Math.PI*2);ctx.fill();
    }
  }

  ctx.save();
  const kx=isLight?735:585, ky=168;
  ctx.translate(kx,ky);

  const armorBase=isLight?'#2b2927':'#110e0d';
  const armorMid=isLight?'#4a4744':'#1f1917';
  const armorRim=isLight?'#d8d5ce':'#ff8533';
  const armorSubRim=isLight?'#9e9a92':'#b84a1b';

  for(let i=0;i<85;i++){
    const px=-25-rand()*150, py=15+rand()*125, pr=3+rand()*18;
    ctx.fillStyle=isLight?`rgba(45,42,38,${0.04+rand()*0.18})`:`rgba(25,16,14,${0.12+rand()*0.25})`;
    ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fill();
  }
  for(let i=0;i<160;i++){
    const px=-10-rand()*175, py=5+rand()*135, pr=0.8+rand()*2.4;
    ctx.fillStyle=isLight?`rgba(30,28,25,${0.25+rand()*0.55})`:`rgba(255,120,40,${0.15+rand()*0.45})`;
    ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fill();
  }

  ctx.save();
  ctx.translate(isLight?58:-52, 48);
  ctx.rotate(isLight?0.18:-0.28);
  const blG=ctx.createLinearGradient(-4,0,4,0);
  blG.addColorStop(0,armorRim);blG.addColorStop(0.5,armorMid);blG.addColorStop(1,'#090808');
  ctx.fillStyle=blG;
  ctx.beginPath();ctx.moveTo(-3.5,-22);ctx.lineTo(3.5,-22);ctx.lineTo(2,145);ctx.lineTo(-2,145);ctx.closePath();ctx.fill();
  ctx.fillStyle=armorSubRim;
  ctx.beginPath();ctx.moveTo(-22,-22);ctx.quadraticCurveTo(0,-17,22,-22);ctx.quadraticCurveTo(0,-26,-22,-22);ctx.fill();
  ctx.fillStyle=armorBase;
  ctx.fillRect(-2.5,-46,5,24);
  ctx.fillStyle=armorRim;
  ctx.beginPath();ctx.arc(0,-49,5,0,Math.PI*2);ctx.fill();
  ctx.restore();

  const arrows=[[-62,8,-14,52],[-74,26,-18,64],[-50,-2,-8,46]];
  arrows.forEach(([x1,y1,x2,y2])=>{
    ctx.strokeStyle=armorMid;ctx.lineWidth=2.2;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.strokeStyle=armorRim;ctx.lineWidth=0.9;
    ctx.beginPath();ctx.moveTo(x1,y1-0.8);ctx.lineTo(x2,y2-0.8);ctx.stroke();
    ctx.fillStyle=armorBase;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1-9,y1-8);ctx.lineTo(x1+4,y1-2);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1-11,y1+2);ctx.lineTo(x1+3,y1+4);ctx.closePath();ctx.fill();
  });

  function drawArmorPlate(pts,rimSide='top'){
    ctx.fillStyle=armorBase;
    ctx.beginPath();
    pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
    ctx.closePath();
    ctx.fill();

    const g=ctx.createLinearGradient(pts[0][0],pts[0][1],pts[2][0],pts[2][1]);
    g.addColorStop(0,armorSubRim);
    g.addColorStop(0.35,armorMid);
    g.addColorStop(1,armorBase);
    ctx.fillStyle=g;
    ctx.fill();

    ctx.strokeStyle=armorRim;
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(pts[0][0],pts[0][1]);
    ctx.lineTo(pts[1][0],pts[1][1]);
    if(rimSide==='both')ctx.lineTo(pts[2][0],pts[2][1]);
    ctx.stroke();
  }

  ctx.fillStyle=isLight?'rgba(38,35,32,0.88)':'rgba(20,12,11,0.94)';
  ctx.beginPath();
  ctx.moveTo(-25,42);
  ctx.quadraticCurveTo(-78,85,-115,155);
  ctx.quadraticCurveTo(-55,165,-5,152);
  ctx.quadraticCurveTo(28,120,18,52);
  ctx.closePath();
  ctx.fill();

  for(let i=0;i<6;i++){
    const y=42+i*14, w=34+i*2.5;
    drawArmorPlate([[-w,y],[w,y-3],[w+4,y+13],[-w-3,y+15]],'top');
  }

  for(let i=0;i<4;i++){
    const dy=i*9;
    drawArmorPlate([[-46-i*2,34+dy],[-12,26+dy],[-10,38+dy],[-48-i*2,45+dy]],'both');
    drawArmorPlate([[12,28+dy],[46+i*2,36+dy],[48+i*2,47+dy],[10,40+dy]],'both');
  }

  ctx.save();
  ctx.translate(4, 8);
  ctx.rotate(0.24);
  ctx.fillStyle=isLight?'#3b3734':'#381412';
  ctx.beginPath();ctx.moveTo(-8,-16);ctx.quadraticCurveTo(-42,-28,-64,-4);ctx.quadraticCurveTo(-32,-2,-6,-2);ctx.fill();
  drawArmorPlate([[-18,-10],[2,-22],[22,-8],[20,14],[-18,14]],'both');
  drawArmorPlate([[-14,6],[24,2],[28,18],[4,28],[-16,18]],'both');
  ctx.strokeStyle=armorRim;ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(6,10);ctx.lineTo(23,9);ctx.moveTo(5,15);ctx.lineTo(22,14);ctx.stroke();
  ctx.restore();

  drawArmorPlate([[24,52],[48,48],[62,92],[42,96]],'both');
  drawArmorPlate([[-42,50],[-24,48],[-32,98],[-52,94]],'top');
  drawArmorPlate([[-38,118],[32,115],[52,162],[-54,162]],'top');
  ctx.restore();
}

/* 2. STUDY LABYRINTH WITH ALL 7 TACTICAL ITEMS */

  const r=S.run.study;
  if(!r){
    const opts=[60,120,180,240],t=S.sel.study;
    const pen=Math.pow(0.5,S.stats.earlyStreak||0);
    const sBonus=getStreakBonusPctForDay(S.streak.cur||0);
    return `<section class="card cut">
      <h2>Лабиринт учёбы</h2>
      <p class="mut">Укажи план на сегодня. В первые 3 хода ключ выпасть не может. Найденные в лабиринте ключи зачисляют деньги и остаются у тебя для покупок в Магазине!</p>
      ${S.stats.earlyStreak>0?`<p style="color:var(--ye);font-size:13.5px;margin-top:6px">⚡ В прошлом забеге выпал досрочный ключ (серия: ${S.stats.earlyStreak}). Шанс на ключ в этом забеге снижен до <b>${Math.round(pen*100)}%</b> от базового. Пройди полное время без ключа, чтобы сбросить штраф!</p>`:''}
      <div class="chips">${opts.map(v=>`<button class="chip cut-sm ${t===v?'on':''}" data-a="sel" data-v="${v}">${v/60} ч</button>`).join('')}</div>

      <div class="kv">Награда за полный план (с учётом бонуса серии +${sBonus}%)<b>${fmt(money('study',t)*getStreakMult())}</b></div>
      <div class="row">
        <button class="btn cy" data-a="startStudy">Войти в лабиринт</button>
        ${(S.stats.savedGames||0)>0?`<button class="btn ye" data-a="playSavedGame">🎮 Сыграть отложенную катку (${S.stats.savedGames})</button>`:''}
      </div>
    </section>`;
  }

  const p=Math.min(100,r.prog/r.target*100);
  const stepInfo=r.step<3?`Ход ${r.step+1} (защита 1-3: ${r.step}/3)`:`Ход ${r.step+1} (ключи активны)`;
  const hudHtml=`<div class="hud">
    <div><span class="mut" style="font-size:12.5px">Прогресс • ${stepInfo}</span><b>${r.prog} / ${r.target} мин</b></div>
    <div><span class="mut" style="font-size:12.5px">Накоплено</span><b style="color:var(--ye)">${fmt(r.earned)}</b></div>

  /* Tactical Inventory Bar inside the Labyrinth */
  const invBarHtml=`<div class="inv-bar cut-sm">
    <strong style="color:var(--cy);font-size:13px;width:100%;margin-bottom:2px">🎒 Предметы в забеге (Запас катки: ${S.inv.bank_game||0}):</strong>
    <button class="btn gh" style="padding:6px 9px;font-size:12px" data-a="useItem" data-v="reroll" ${(S.inv.reroll||0)<=0||r.usedReroll||r.phase!=='doors'?'disabled':''}>
      🔄 Переброс (${S.inv.reroll||0}) ${r.usedReroll?'[исп.]':''}
    </button>
    <button class="btn gh" style="padding:6px 9px;font-size:12px;${r.scouting?'border-color:var(--gr);color:var(--gr)':''}" data-a="useItem" data-v="scout" ${(S.inv.scout||0)<=0||r.phase!=='doors'?'disabled':''}>
      🔍 Разведка (${S.inv.scout||0}) ${r.scouting?'[выбери!]':''}
    </button>
    <button class="btn gh" style="padding:6px 9px;font-size:12px;${r.shieldArmed?'border-color:var(--cy);color:var(--cy)':''}" data-a="useItem" data-v="shield" ${((S.inv.shield||0)<=0&&!r.shieldArmed)||r.usedShield?'disabled':''}>
      🛡️ Щит (${S.inv.shield||0}) ${r.usedShield?'[сраб.]':r.shieldArmed?'[АКТИВЕН]':''}
    </button>
    <button class="btn gh" style="padding:6px 9px;font-size:12px;${S.buffs.breather?'border-color:var(--gr);color:var(--gr)':''}" data-a="useItem" data-v="breather" ${(S.inv.breather||0)<=0||S.buffs.breather?'disabled':''}>
      💨 Передышка (${S.inv.breather||0}) ${S.buffs.breather?'[АКТИВНА]':''}
    </button>
    <button class="btn gh" style="padding:6px 9px;font-size:12px;${S.buffs.double_xp?'border-color:var(--vi);color:var(--vi)':''}" data-a="useItem" data-v="double_xp" ${(S.inv.double_xp||0)<=0||S.buffs.double_xp?'disabled':''}>
      ⚡ Очки ×2 (${S.inv.double_xp||0}) ${S.buffs.double_xp?'[АКТИВНЫ]':''}
    </button>
  </div>`;

  const runActions=`<div class="row" style="justify-content:space-between;margin-top:14px">
    ${r.earned>0?`<button class="btn ye" data-a="cashoutAsk">Забрать ${fmt(r.earned)} и выйти</button>`:''}
    <button class="btn gh" data-a="resetAsk">Сбросить забег</button>
  </div>`;

  if(r.phase==='doors'){
    return `<section class="card cut">${hudHtml}${invBarHtml}
      <h2>${r.scouting?'🔍 Нажми на любую дверь, чтобы разведать её содержимое':'Выбери врата (по возрастанию риска)'}</h2>
      <div class="doors">${r.d.map((d,i)=>{
        const od=getDoorOdds(d,r.step);
        const sc=r.scouted&&r.scouted[i];
        let scTxt='';
        if(sc){
          scTxt=sc.type==='key'?'🔑 КЛЮЧ!':sc.type==='game'?'🎮 КАТКА!':sc.type==='rest'?`🔥 Отдых ${sc.dur} мин`:`📖 Учёба ${sc.dur} мин (${sc.t[1]})`;
        }
        return `<button class="door cut ${r.op===i?'open':''} ${r.op>=0&&r.op!==i?'dim':''} ${r.scouting&&!sc?'scout-target':''}" style="--c:${d.col}" data-a="openDoor" data-v="${i}">
          <span class="risk-pill">${d.risk}</span>
          ${sc?`<span class="scout-badge">🔍 Разведано: ${scTxt}</span>`:''}
          <div class="nm">${d.n}</div>
          <div class="frame"><div class="glow"></div><div class="panel p${d.id}"></div></div>
          <div class="od"><span>Учёба</span><u style="--w:${od.s}%"></u><b>${od.s}%</b></div>
          <div class="od"><span>Отдых</span><u style="--w:${od.r}%"></u><b>${od.r}%</b></div>
          <div class="od" style="--c:#c98218"><span>Катка</span><u style="--w:${Math.min(100,od.g*5)}%"></u><b>${od.g}%</b></div>
          <div class="od" style="--c:#b8860b"><span>Ключ</span><u style="--w:${Math.min(100,od.k*6)}%"></u><b>${od.canKey?od.k+'%':'0% (1-3)'}</b></div>
          <div class="hist">${DUR.map(x=>`<i style="height:${Math.round(dw(d.c,x)*100)}%;background:${tier('focus',x)[0]}"></i>`).join('')}</div>
          <div class="hs">Таймер 10–60 мин, чаще около ${d.c} мин</div>
        </button>`;
      }).join('')}</div>
      ${runActions}
    </section>`;
  }

  if(r.phase==='reveal'){
    const c=r.cur,rest=c.type==='rest',game=c.type==='game';
    const tt=tier(c.type,c.dur),col=tt[0],tn=tt[1];
    if(game){
      return `<section class="card cut pop" style="--t:${col};border-color:${col}">
        <div class="rays"></div>${hudHtml}
        <div style="color:${col};margin:8px 0">${icon('game',72)}</div>
        <span class="tag gold">КАТКА</span>
        <h2 style="color:${col}">Время сыграть катку!</h2>
        <p class="mut" style="max-width:460px;margin:8px auto 14px">Тебе выпала законная игровая партия без таймера и ограничений по минутам. Можешь сыграть сейчас или отложить её в запас (если есть предмет «Запас катки»).</p>
        <div class="row" style="justify-content:center">
          <button class="btn ye" data-a="finishRoom">Катка сыграна — идти дальше</button>
          ${(S.inv.bank_game||0)>0?`<button class="btn cy" data-a="saveGameForLater">📦 Отложить в запас (ост. ${S.inv.bank_game})</button>`:''}
          <button class="btn gh" data-a="cancelRoom">Пропустить</button>
        </div>
      </section>`;
    }
    return `<section class="card cut pop" style="--t:${col};border-color:${col}">
      <div class="rays"></div>${hudHtml}
      <div style="color:${col};margin:8px 0">${icon(rest?'rest':'study',68)}</div>
      <span class="tag">${tn}</span>
      <h2 style="color:${col}">${rest?'Отдых до':'Учёба'} ${c.dur} мин</h2>
      ${c.note?`<p style="color:var(--cy);font-weight:700;margin:6px 0">${c.note}</p>`:''}
      <p class="mut">${c.tip||(rest?'Передохни у костра, а таймер подскажет, когда пора возвращаться.':'Сфокусируйся на задаче. Таймер запустится после нажатия.')}</p>
      <div class="row" style="justify-content:center"><button class="btn ${rest?'gr':'cy'}" data-a="startTimer">Запустить таймер</button></div>
    </section>`;
  }

  if(r.phase==='timer'){
    const c=r.cur,rest=c.type==='rest',col=tier(c.type,c.dur)[0];
    const tot=c.dur*60000,pct=(1-c.left/tot)*100;
    return `<section class="card cut" style="border-color:${col}">${hudHtml}
      <div class="center">
        <h2 style="color:${col}">${rest?'Отдых до':'Учёба'} ${c.dur} мин</h2>
        <div class="ring" id="ring" style="--p:${pct};--c:${col}">
          <div><div class="big" id="tm">${mmss(c.left)}</div><div class="mut">${c.paused?'на паузе':'идёт время'}</div></div>
        </div>
        <div class="row" style="justify-content:center">
          <button class="btn ${rest?'gr':'cy'}" data-a="pauseTimer">${c.paused?'Продолжить':'Пауза'}</button>
          <button class="btn vi" data-a="finishRoom">${rest?'Закончить отдых':'Отметить: отзанимался'}</button>
          <button class="btn gh" data-a="cancelRoom">Отменить комнату</button>
        </div>
      </div>
      ${runActions}
    </section>`;
  }

  return `<section class="card cut center" style="border-color:var(--ye)">
    <div style="color:var(--ye);margin:8px 0 12px">${icon('key',76)}</div>
    <h2 style="color:var(--ye)">${r.early?'Ключ найден! Досрочный побег из лабиринта':'План полностью выполнен! Ключ твой'}</h2>
    <p class="mut">${r.early?'Удача улыбнулась тебе раньше срока. Ключ добавлен в твой инвентарь для Магазина и Кейсов!':'Ты закрыл весь учебный план. Штрафы сброшены, а ключ добавлен в твой инвентарь для Магазина!'}</p>
    <div class="kv">Зачислено в банк (с бонусом серии)<b>${fmt(r.earned)}</b></div>
    <div class="row" style="justify-content:center">
      <button class="btn cy" data-a="endStudyRun">Новый забег</button>
      <button class="btn ye" data-a="tab" data-v="shop">Перейти в Магазин и Кейсы (${S.stats.keyBalance||0} ключ.)</button>
    </div>
  </section>`;

/* 6. PROGRESS, FULL-SCREEN GITHUB HEATMAP, WEEKLY CHART, BEST TIME OF DAY & BACKUP */
function progressView(){
  /* Build 140 days (20 weeks) GitHub heatmap — fits full width without scrolling */
  const today=new Date();
  const dayOfWk=(today.getDay()+6)%7;
  const endMon=new Date(today.getFullYear(),today.getMonth(),today.getDate()-dayOfWk);
  const cells=[];
  for(let w=19;w>=0;w--){
    for(let d=0;d<7;d++){
      const dt=new Date(endMon.getTime()-(w*7-d)*86400000);
      const k=toDayKey(dt.getTime());
      const rec=S.daily[k]||{min:0,wk:0};
      const score=(rec.min||0)+(rec.wk||0)*45;
      const lvl=score>=180?4:score>=90?3:score>=30?2:score>0?1:0;
      cells.push({k,min:rec.min||0,wk:rec.wk||0,lvl});
    }
  }

  /* Last 8 weeks bar chart */
  const weeks=[];
  for(let w=7;w>=0;w--){
    const mon=new Date(endMon.getTime()-w*7*86400000);
    const wkKey=toDayKey(mon.getTime());
    const prog=getWeekProgress(wkKey);
    weeks.push({lbl:wkKey.slice(5),hrs:+(prog.min/60).toFixed(1),wk:prog.wk});
  }
  const maxHrs=Math.max(5,...weeks.map(x=>x.hrs));

  /* Best time of day analysis */
  const periods=[
    {n:'Утро (06–12)',v:S.hours.slice(6,12).reduce((a,b)=>a+b,0)},
    {n:'День (12–18)',v:S.hours.slice(12,18).reduce((a,b)=>a+b,0)},
    {n:'Вечер (18–24)',v:S.hours.slice(18,24).reduce((a,b)=>a+b,0)},
    {n:'Ночь (00–06)',v:S.hours.slice(0,6).reduce((a,b)=>a+b,0)}
  ];
  const bestPeriod=periods.slice().sort((a,b)=>b.v-a.v)[0];
  let peakHr=0;
  S.hours.forEach((v,i)=>{if(v>(S.hours[peakHr]||0))peakHr=i});

  return `<section class="card cut" style="border-color:var(--cy)">
    <h2>🟩 Цифровая карта активности (20 недель целиком)</h2>
    <p class="mut" style="font-size:13px">Полная панорама за 140 дней на одном экране. Чем ярче клетка, тем больше учёбы и тренировок было в этот день.</p>
    <div class="heatmap-wrap">
      <div class="heatmap">
        ${cells.map(c=>`<div class="hm-cell ${c.lvl?'l'+c.lvl:''}" title="${c.k}: Учёба ${c.min} мин, Тренировок: ${c.wk}"></div>`).join('')}
      </div>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:8px;font-size:12px">
      <span>🔥 Серия: <b>${S.streak.cur||0} дн.</b> (Рекорд: <b>${S.streak.best||0} дн.</b>)</span>
      <span class="mut">Меньше <span class="hm-legend-cell"></span> <span class="hm-legend-cell l2"></span> <span class="hm-legend-cell l4"></span> Больше</span>
    </div>
  </section>

  <section class="card cut">
    <h2>📊 Часы учёбы и тренировки по неделям</h2>
    <div class="chart-bars">
      ${weeks.map(w=>`<div class="c-col">
        <span class="c-val">${w.hrs}ч${w.wk?`/${w.wk}т`:''}</span>
        <div class="c-bar" style="height:${Math.max(4,Math.round((w.hrs/maxHrs)*100))}%"></div>
        <span class="c-lbl">${w.lbl}</span>
      </div>`).join('')}
    </div>
  </section>

  <section class="card cut">
    <h2>🕰️ Лучшее время суток для продуктивности</h2>
    <p class="mut">Пиковый период: <b style="color:var(--cy)">${bestPeriod.v>0?bestPeriod.n:'Пока мало данных'}</b> • Пиковый час: <b style="color:var(--cy)">${String(peakHr).padStart(2,'0')}:00</b></p>
    <div class="stats" style="margin-top:10px">
      ${periods.map(p=>`<div class="st"><span>${p.n}</span><b>${hm(p.v)}</b></div>`).join('')}
    </div>
  </section>

  <section class="card cut" style="border-color:var(--gr)">
    <h2>💾 Сохранность данных (Резервная копия)</h2>
    <p class="mut">Сохрани файл прогресса на устройство, чтобы никогда не потерять свои часы, ранги, банк и рекорды.</p>
    <div class="row">
      <button class="btn cy" data-a="exportData">⬇️ Скачать резервную копию (.json)</button>
      <button class="btn gh" data-a="importDataAsk">⬆️ Загрузить копию из файла</button>
    </div>
  </section>`;
}

/* LABYRINTH RESOLUTION LOGIC (WITH SCOUT & SHIELD OF THE ABYSS SUPPORT) */
function resolveDoor(i){
  const r=S.run.study;if(!r||r.op!==i)return;
  const d=r.d[i],rem=r.target-r.prog;
  const pre=(r.scouted&&r.scouted[i])?r.scouted[i]:rollDoorOutcome(d,r.step,rem);
  let {type,dur,t,note}=pre;

  if(type==='key'){
    r.phase='done';r.early=true;
    S.stats.keys++;
    S.stats.keyBalance=(S.stats.keyBalance||0)+1;
    S.stats.earlyKeys=(S.stats.earlyKeys||0)+1;
    S.stats.earlyStreak=(S.stats.earlyStreak||0)+1;
    if(S.cfg.full&&rem>0)r.earned+=Math.round(money('study',rem));
    r.earned=creditMoney(r.earned,true);
    recordDailyActivity(0,0,1);
    addStudyLog(`Учёба: ${hm(r.prog)} (ключ найден на ходу ${r.step+1}, +1 🔑 в инвентарь)`,r.earned);
    snd('key');burst(TC.au,160);
  }else{
    /* Shield from Hellish >=50 min block */
    if(type==='focus'&&dur>=50&&!r.usedShield&&(r.shieldArmed||(S.inv.shield||0)>0)){
      if(!r.shieldArmed)S.inv.shield--;
      r.shieldArmed=false;
      r.usedShield=true;
      note=`🛡️ Щит от «адского» смягчил таймер: ${dur} мин → 40 мин!`;
      dur=40;
      t=tier(type,dur);
    }
    r.cur={type,dur,left:dur*60000,end:0,paused:true,note,tip:type==='rest'?TIPS[rnd(0,TIPS.length-1)]:''};
    r.phase='reveal';
    snd('t_'+t[2]);burst(t[0],t[2]==='r'||t[2]==='au'?90:45);
  }
  save();render();
}

function finishStudyRoom(){
  const r=S.run.study;if(!r||!r.cur)return;
  const c=r.cur;
  r.step=(r.step||0)+1;
  if(c.type==='focus'){
    const u=c.dur;
    r.prog+=u;
    S.stats.min+=u;
    let tok=Math.max(1,Math.round(u/15));
    if(S.buffs.double_xp){
      S.stats.bonusRankMin=(S.stats.bonusRankMin||0)+u;
      tok*=2;
      S.buffs.double_xp=false;
    }
    S.stats.tokens=(S.stats.tokens||0)+tok;
    r.earned+=Math.round(money('study',u));
    recordDailyActivity(u,0,1);
  }else if(c.type==='game'){
    S.stats.games=(S.stats.games||0)+1;
    recordDailyActivity(0,0,1);
  }else{
    recordDailyActivity(0,0,1);
  }
  r.cur=null;
  r.scouted={};
  if(r.prog>=r.target){
    r.phase='done';r.early=false;
    S.stats.keys++;
    S.stats.keyBalance=(S.stats.keyBalance||0)+1;
    S.stats.fullRuns=(S.stats.fullRuns||0)+1;
    S.stats.earlyStreak=0;
    r.earned=creditMoney(r.earned,true);
    addStudyLog(`Учёба (полный план): ${hm(r.prog)} (+1 🔑 в инвентарь)`,r.earned);
    snd('key');burst('#d4af37',140);
  }else{
    r.phase='doors';r.d=pickDoors();r.op=-1;snd('done');
  }
  save();render();
}

    if(r.scouting){
