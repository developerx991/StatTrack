  /* SHOP & CS2 CASE ROULETTE ACTIONS */
  buyItem:d=>{
    const id=d.v;
    const it=SHOP_ITEMS.find(x=>x.id===id);if(!it)return;
    const cost=id==='reroll'?(1+(S.shop.rerollBuys||0)):it.baseCost;
    if((S.stats.keyBalance||0)<cost)return;
    S.stats.keyBalance-=cost;
    if(id==='reroll')S.shop.rerollBuys=(S.shop.rerollBuys||0)+1;
    S.inv[id]=(S.inv[id]||0)+1;
    snd('done');burst(it.col,65);
    save();render();
  },
  spinCase:d=>{
    if(caseSpinning)return;
    const isFree=d.free==='1'&&(S.stats.chests||0)>0;
    if(!isFree&&(S.stats.keyBalance||0)<1)return;
    if(isFree)S.stats.chests--;
    else S.stats.keyBalance--;
    save();

    /* Weighted random pick for index 36 */
    const totW=SHOP_ITEMS.reduce((a,b)=>a+b.w,0);
    let rw=Math.random()*totW, winItem=SHOP_ITEMS[0];
    for(const it of SHOP_ITEMS){rw-=it.w;if(rw<=0){winItem=it;break}}

    const track=$('#roulette-track');
    if(!track){
      S.inv[winItem.id]=(S.inv[winItem.id]||0)+1;
      S.shop.lastWon=winItem.n;
      save();render();return;
    }

    caseSpinning=true;
    const winIdx=36;
    const cards=track.querySelectorAll('.r-card');
    if(cards[winIdx]){
      cards[winIdx].style.setProperty('--rc',winItem.col);
      cards[winIdx].innerHTML=`<div style="color:${winItem.col}">${icon(winItem.ic,24)}</div><b>${winItem.n}</b>`;
    }

    const viewportW=track.parentElement.clientWidth;
    const cardW=136; /* 128px + 8px gap */
    const targetOffset=(winIdx*cardW)-(viewportW/2)+(128/2)+rnd(-24,24);

    track.style.transition='none';
    track.style.transform='translateX(0px)';
    void track.offsetWidth;
    track.style.transition='transform 3.4s cubic-bezier(0.12, 0.8, 0.18, 1)';
    track.style.transform=`translateX(-${targetOffset}px)`;

    [120,260,420,600,800,1050,1350,1700,2100,2550,3000].forEach(ms=>setTimeout(()=>snd('tick'),ms));

    setTimeout(()=>{
      caseSpinning=false;
      S.inv[winItem.id]=(S.inv[winItem.id]||0)+1;
      S.shop.lastWon=winItem.n;
      snd('key');burst(winItem.col,130);
      save();render();
    },3500);
  },

  /* QUESTS */
  doMiniWorkout:()=>{
    S.quests.miniDone=true;
    recordDailyActivity(0,0,0);
    snd('done');burst('#52a86f',60);
    save();render();
  },
  claimQuest:d=>{
    const id=d.v;
    if(S.quests.claimed[id])return;
    const q=getQuestsList().find(x=>x.id===id);
    if(!q||q.cur<q.target)return;
    S.quests.claimed[id]=true;
    if(q.money>0){
      const m=creditMoney(q.money,false);
      addBankLog(`Награда за квест «${q.n}»`,m);
    }
    if(q.chests>0)S.stats.chests=(S.stats.chests||0)+q.chests;
    if(q.keys>0)S.stats.keyBalance=(S.stats.keyBalance||0)+q.keys;
    snd('key');burst('#d4af37',110);
    save();render();
  },

  /* WORKOUT ACTIONS */
  toggleMuscle:d=>{
    const id=d.v,arr=S.wkForm.sel;
    const idx=arr.indexOf(id);
    if(idx>=0)arr.splice(idx,1);else arr.push(id);
    snd('tick');save();render();
  },
  logWorkout:()=>{
    const durInp=$('#wk-dur-inp'),custInp=$('#custom-act-inp');
    const dur=durInp?Math.max(0,+durInp.value||0):0;
    const cust=custInp?custInp.value.trim():'';
    const sel=S.wkForm.sel.length?S.wkForm.sel:['home'];

    S.stats.wk=(S.stats.wk||0)+1;
    if(dur>0)S.stats.wkMin=(S.stats.wkMin||0)+dur;

    const names=[];
    sel.forEach(id=>{
      S.stats.muscles[id]=(S.stats.muscles[id]||0)+1;
      const m=MUSCLES.find(x=>x.id===id);
      if(m)names.push(id==='other'&&cust?`Другое (${cust})`:m.n);
    });
    if(sel.includes('other')&&cust){
      S.stats.customActs[cust]=(S.stats.customActs[cust]||0)+1;
    }

    const label=`Тренировка: ${names.join(', ')}${dur?` (${dur} мин)`:''}`;
    const earned=creditMoney(S.cfg.rw,true);
    recordDailyActivity(0,1,0);
    addWorkLog(label,earned);
    S.wkForm.dur='';S.wkForm.customName='';
    snd('key');burst('#4f9e69',110);
    save();render();
    return label;
  },
  logWorkoutAndJournal:()=>{
    const lbl=A.logWorkout();
    S.gym.draft.workoutRef=lbl;
    S.tab='gym';
    save();render();
  },
  openGymForWorkout:d=>{
    S.gym.draft.workoutRef=d.v||'Тренировка';
    S.tab='gym';
    snd('tick');save();render();
  },

  /* BODY METRICS */
  addBodyMetric:()=>{
    const w=parseFloat($('#bm-weight')?.value);
    const waist=parseFloat($('#bm-waist')?.value)||0;
    if(!(w>20&&w<300))return;
    S.bodyMetrics.push({d:toDayKey(),w:+w.toFixed(1),waist});
    S.bodyMetrics=S.bodyMetrics.slice(-30);
    snd('done');save();render();
  },

  /* EXERCISE JOURNAL & PR ACTIONS */
  pickExName:d=>{
    S.gym.draft.exName=d.v;
    snd('tick');save();render();
  },
  addGymSet:()=>{
    const ex=($('#gym-ex-inp')?.value||S.gym.draft.exName||'Упражнение').trim();
    const w=Math.max(0,parseFloat($('#gym-w-inp')?.value)||0);
    const r=Math.max(1,parseInt($('#gym-r-inp')?.value,10)||1);
    S.gym.draft.exName=ex;
    S.gym.draft.weight=w;
    S.gym.draft.reps=r;
    S.gym.draft.sets.push({ex,w,r});
    snd('tick');save();render();
  },
  delGymSet:d=>{
    S.gym.draft.sets.splice(+d.v,1);
    snd('tick');save();render();
  },
  saveGymSession:()=>{
    const d=S.gym.draft;
    if(!d.sets.length)return;
    const note=($('#gym-note-inp')?.value||d.note||'').trim();
    const today=toDayKey();
    d.sets.forEach(s=>{
      const e1rm=Math.round(s.w*(1+s.r/30));
      const cur=S.gym.prs[s.ex];
      if(!cur||s.w>cur.maxW||(s.w===cur.maxW&&s.r>cur.reps)){
        S.gym.prs[s.ex]={maxW:s.w,reps:s.r,e1rm,date:today};
      }
    });
    S.gym.sessions.unshift({
      t:Date.now(),
      title:d.workoutRef||'Силовая тренировка',
      note,
      sets:d.sets.slice()
    });
    S.gym.sessions=S.gym.sessions.slice(0,50);
    S.gym.draft.sets=[];
    S.gym.draft.note='';
    S.gym.draft.workoutRef='';
    snd('key');burst('#d49b4b',90);
    save();render();
  },

  /* PROFILE & MEDALS */
  setAva:d=>{S.profile.ava=d.v;snd('tick');save();render()},
  setAccent:d=>{S.profile.accent=d.v;snd('tick');save();render()},
  saveProfile:()=>{
    const n=$('#prof-nick-inp')?.value.trim(),t=$('#prof-title-inp')?.value.trim();
    if(n)S.profile.nick=n;
    if(t)S.profile.title=t;
    snd('done');burst(S.profile.accent,60);save();render();
  },
  pinMedal:d=>{
    const id=d.v;
    S.profile.medals=S.profile.medals||[];
    const idx=S.profile.medals.indexOf(id);
    if(idx>=0)S.profile.medals.splice(idx,1);
    else{
      if(S.profile.medals.length>=4)S.profile.medals.shift();
      S.profile.medals.push(id);
    }
    snd('tick');save();render();
  },

  /* BANK & WEEKLY PLAN */
  topup:()=>{
    const v=Math.round(+$('#am').value);if(!(v>0))return;
    S.bank.card+=v;addBankLog('Пополнение депозита карты',v);
    snd('done');save();render();
  },
  payout:()=>{
    let v=Math.round(+$('#pm').value);v=Math.min(v,S.bank.pend);if(!(v>0))return;
    S.bank.pend-=v;S.bank.paid+=v;S.bank.card=Math.max(0,S.bank.card-v);
    addBankLog('Выплата заработанных средств',-v);
    snd('done');save();render();
  },
  createWeeklyPlan:()=>{
    syncCalendarState();
    if(S.weeklyPlan.created)return;
    const h=Math.max(1,+$('#wp-hrs-inp')?.value||10);
    const w=Math.max(1,+$('#wp-wk-inp')?.value||3);
    S.weeklyPlan.studyHrs=h;
    S.weeklyPlan.workouts=w;
    S.weeklyPlan.created=true;
    if(!S.weeklyPlan.creationBonusPaid){
      S.weeklyPlan.creationBonusPaid=true;
      const bonus=creditMoney(300,false);
      S.stats.tokens=(S.stats.tokens||0)+1;
      addBankLog(`Бонус за составление недельного плана (${h} ч, ${w} трен.)`,bonus);
    }
    checkWeeklyPlanCompletion();
    snd('key');burst('#52a86f',90);
    save();render();
  },

  /* DATA EXPORT / IMPORT */
  exportData:()=>{
    const dataStr='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S,null,2));
    const a=document.createElement('a');
    a.href=dataStr;
    a.download=`stattrack_backup_${toDayKey()}.json`;
    a.click();
    snd('done');
  },
  importDataAsk:()=>{
    $('#import-file-inp')?.click();
  },

  /* SETTINGS */
  resetDoorsCfg:()=>{
    S.cfg.doors=JSON.parse(JSON.stringify(DEF_DOORS));
    S.cfg.kMult=1;S.cfg.gMult=1;S.cfg.rMult=1;
    snd('done');save();render();
  },
  wipeAsk:()=>{modalState='wipe';snd('tick');renderModal()},
  wipeConfirm:()=>{S=DEF();modalState=null;save();render();drawGrid()}
};

$('#import-file-inp')?.addEventListener('change',e=>{
  const file=e.target.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      if(parsed&&parsed.stats&&parsed.bank){
        S=normalizeState(parsed);
        save();render();snd('key');
      }
    }catch(err){}
  };
  reader.readAsText(file);
});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset,e);
});

document.addEventListener('input',e=>{
  if(e.target.id==='wk-dur-inp')S.wkForm.dur=e.target.value;
  if(e.target.id==='custom-act-inp')S.wkForm.customName=e.target.value;
  if(e.target.id==='gym-ex-inp')S.gym.draft.exName=e.target.value;
  if(e.target.id==='gym-w-inp')S.gym.draft.weight=+e.target.value;
  if(e.target.id==='gym-r-inp')S.gym.draft.reps=+e.target.value;
  if(e.target.id==='gym-note-inp')S.gym.draft.note=e.target.value;
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.door!==undefined){
    const idx=+t.dataset.door,f=t.dataset.df,val=Math.max(0,+t.value||0);
    const d=S.cfg.doors[idx];
    if(d){
      d[f]=val;
      d.s=Math.max(1,+(100-d.r-d.g-d.k).toFixed(1));
      save();render();
    }
    return;
  }
  const k=t.dataset.k;if(!k)return;
  if(k==='selStudy')S.sel.study=Math.max(10,+t.value||60);
  else if(k==='full')S.cfg.full=t.checked;
  else S.cfg[k]=Math.max(0,+t.value||0);
  save();render();
});

/* TIMER LOOP (STUDY LABYRINTH) */
setInterval(()=>{
  const r=S.run.study;
  if(!r||r.phase!=='timer'||!r.cur||r.cur.paused)return;
  r.cur.left=r.cur.end-Date.now();
  if(r.cur.left<=0){finishStudyRoom();return}
  if(S.tab==='study'){
    const t=$('#tm'),g=$('#ring');
    if(t)t.textContent=mmss(r.cur.left);
    if(g)g.style.setProperty('--p',(1-r.cur.left/(r.cur.dur*60000))*100);
  }
},400);

/* BACKGROUND CANVAS: RISING BONFIRE EMBERS (DARK) & DRIFTING ASH (LIGHT) */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const bg=$('#bg'),fx=$('#fx'),bx=bg.getContext('2d'),fc=fx.getContext('2d');
let W=0,H=0,PT=[];
const rgb=h=>{
  const c=h.startsWith('#')?h:'#d49b4b';
  return [1,3,5].map(i=>parseInt(c.substr(i,2),16)||180).join(',');
};
function drawGrid(){
  W=bg.width=fx.width=innerWidth;H=bg.height=fx.height=innerHeight;
  bx.clearRect(0,0,W,H);
  bx.strokeStyle=S.theme==='light'?'rgba(60,50,40,0.04)':'rgba(212,155,75,0.03)';
  bx.lineWidth=1;
  const s=56;
  bx.beginPath();
  for(let x=0;x<W;x+=s){bx.moveTo(x,0);bx.lineTo(x,H)}
  for(let y=0;y<H;y+=s){bx.moveTo(0,y);bx.lineTo(W,y)}
  bx.stroke();
}
function ember(){
  return{
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    vx:(Math.random()-.5)*.35,
    vy:-.3-Math.random()*.55,
    r:1+Math.random()*2.2,
    c:'255,110,35',
    t:0
  };
}
function burst(h,n=60){
  if(RM)return;const c=rgb(h);
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,s=2+Math.random()*6;
    PT.push({x:W/2,y:H*.38,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:1.5+Math.random()*3,l:1,d:.012+Math.random()*.012,c,t:1});
  }
}
function shake(){if(RM)return;const w=$('.wrap');w.classList.add('shake');setTimeout(()=>w.classList.remove('shake'),450)}
function loop(){
  fc.clearRect(0,0,W,H);PT=PT.filter(p=>!p.t||p.l>0);
  const ambientCol=S.theme==='light'?'75,68,60':'255,105,30';
  for(const p of PT){
    p.x+=p.vx;p.y+=p.vy;
    if(p.t){p.vy+=.06;p.l-=p.d}
    else{if(p.y<-10){p.y=innerHeight+10;p.x=Math.random()*innerWidth}}
    const a=p.t?Math.max(p.l,0):.28+.2*Math.sin((p.y+p.x)/55);
    fc.fillStyle='rgba('+(p.t?p.c:ambientCol)+','+a+')';
    fc.beginPath();fc.arc(p.x,p.y,p.r,0,6.3);fc.fill();
  }
  requestAnimationFrame(loop);
}
drawGrid();
if(!RM){for(let i=0;i<38;i++)PT.push(ember());loop()}
addEventListener('resize',drawGrid);

/* KEYBOARD SHORTCUTS */
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const k=e.key;
  if(k==='Escape'&&modalState){A.closeModal();return;}
  if(k==='m'||k==='M'||k==='ь'||k==='Ь'){A.mute();return;}
  if(S.tab==='study'){
    const r=S.run.study;
    if(!r){if(k==='Enter')A.startStudy();return;}
    if(r.phase==='doors'&&'123'.includes(k))A.openDoor({v:+k-1});
    else if(r.phase==='reveal'&&(k===' '||k==='Enter')){e.preventDefault();r.cur?.type==='game'?A.finishRoom():A.startTimer();}
    else if(r.phase==='timer'){if(k===' '){e.preventDefault();A.pauseTimer();}else if(k==='Enter')A.finishRoom();}
    else if(r.phase==='done'&&k==='Enter')A.endStudyRun();
  }
});

render();
})();
</script>
</body>
