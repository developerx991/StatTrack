<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StatTrack">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StatTrack — Трекер прогресса и дисциплины</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik+Glitch&family=Rubik:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#0a0e14;--card:#131a24;--card2:#1a2432;--ink:#eae6df;--mut:#8492a6;
  --red:#ff3b5c;--cy:#00e5ff;--gr:#2ee86c;--vi:#b545ff;--ye:#ffd026;--or:#ff8a2b;
  --line:#253244;--accent:#00e5ff;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*:before,*:after{box-sizing:inherit;margin:0}
body{min-height:100vh;color:var(--ink);font:400 15px/1.45 Rubik,system-ui,sans-serif;background:var(--bg);overflow-x:hidden}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(500px 420px at 5% 15%,#00e5ff14,transparent),radial-gradient(500px 420px at 95% 80%,#b545ff14,transparent)}
.wrap{max-width:980px;margin:auto;padding:16px 14px 70px;position:relative;z-index:1}
h1,h2,h3,.btn,.chip,.tab,.big,.nm,.kv b,.hud b,.st b,.tag,.rk-name,.logo-txt{font-family:'Russo One',Impact,sans-serif;font-weight:400;letter-spacing:.04em}
.cut{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.cut-sm{clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}

/* HEADER & LOGO */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;text-decoration:none;color:inherit}
.brand-ic{width:46px;height:46px;background:linear-gradient(135deg,#00e5ff,#b545ff);display:grid;place-items:center;border-radius:12px;box-shadow:0 0 20px #00e5ff44;transform:skewX(-6deg)}
.brand-ic svg{color:#090d12;filter:drop-shadow(0 1px 0 #fff6)}
.logo-txt{font-size:30px;line-height:1;text-transform:uppercase;transform:skewX(-6deg);display:flex;align-items:center;gap:2px}
.logo-txt span{color:var(--cy);text-shadow:0 0 14px #00e5ff66}
.logo-sub{display:block;font:400 12px Rubik,sans-serif;color:var(--mut);letter-spacing:.02em;margin-top:3px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{background:var(--card2);color:var(--ink);border:1px solid var(--line);padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;font:500 14px Rubik,sans-serif;transition:.18s}
.icon-btn:hover,.icon-btn.on{border-color:var(--cy);color:var(--cy);box-shadow:0 0 12px #00e5ff33}

/* PROFILE MINI BAR & BRAWL STARS RARITIES */
.prof-bar{background:linear-gradient(90deg,var(--card2),var(--card));border:1px solid var(--line);padding:12px 16px;margin-bottom:14px;display: grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;cursor:pointer;transition:.2s}
.prof-bar:hover{border-color:var(--cy);transform:translateY(-1px)}
.ava{width:54px;height:54px;border-radius:14px;background:#0b1017;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 40%,transparent);flex-shrink:0}
.prof-info{min-width:0}
.prof-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prof-nick{font:700 18px 'Russo One',sans-serif;color:#fff}
.prof-title{font-size:12px;color:var(--cy);background:#00e5ff15;border:1px solid #00e5ff44;padding:2px 8px;border-radius:4px}
.medals-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.medal-mini{width:28px;height:28px;border-radius:7px;background:#0a0e14;border:1px solid var(--line);display:grid;place-items:center;position:relative}
.rk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.rk-cell{position:relative;padding:12px 14px;background:var(--card);border:2px solid var(--rc,#7f8b99);overflow:hidden;cursor:pointer;transition:.2s}
.rk-cell:hover{transform:translateY(-2px)}
.rk-cell .rk-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:4px}
.rk-cell .rk-badge{padding:2px 7px;border-radius:4px;font-weight:700;color:#080b10;background:var(--rc)}
.rk-cell .rk-name{font-size:17px;color:var(--rc);display:flex;align-items:center;gap:6px;margin-bottom:6px;text-transform:uppercase}
.rk-xp{height:7px;background:#080b10;border-radius:4px;overflow:hidden;border:1px solid #ffffff14}
.rk-xp i{display:block;height:100%;background:var(--rc);transition:width .4s}
.rk-sub{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px}

/* RARITY ANIMATIONS (BRAWL STARS STYLE) */
.rar-0{--rc:#8e9aa8}
.rar-1{--rc:#2ee86c;box-shadow:inset 0 0 18px #2ee86c18}
.rar-2{--rc:#2994ff;box-shadow:inset 0 0 22px #2994ff24}
.rar-3{--rc:#b545ff;box-shadow:0 0 14px #b545ff22,inset 0 0 22px #b545ff28;animation:rarPulse 2.8s infinite alternate}
.rar-4{--rc:#ff2a55;box-shadow:0 0 18px #ff2a5533,inset 0 0 26px #ff2a5533;animation:rarFlame 1.8s infinite alternate}
.rar-5{--rc:#00f2fe;border-image:linear-gradient(90deg,#ff2a85,#b545ff,#00e5ff,#2ee86c,#ffd026) 1;animation:rarChroma 3s linear infinite}
.rar-5 .rk-badge,.rar-5 .rk-xp i{background:linear-gradient(90deg,#ff2a85,#b545ff,#00e5ff,#2ee86c);background-size:200% 100%;animation:shine 2.5s linear infinite;color:#fff}
.rar-5 .rk-name{background:linear-gradient(90deg,#ff7eb3,#00e5ff,#ffd026);-webkit-background-clip:text;color:transparent}
.rar-6{--rc:#ffd700;border-color:#ffd700;box-shadow:0 0 24px #ffd70055,inset 0 0 32px #ffd70038;animation:rarLeg 1.1s ease-in-out infinite alternate}
.rar-6 .rk-badge,.rar-6 .rk-xp i{background:linear-gradient(100deg,#b8860b,#fff3a1,#ffd700,#ff9900,#b8860b);background-size:200% 100%;animation:shine 1.6s linear infinite;color:#090c10}
.rar-6 .rk-name{color:#ffe259;text-shadow:0 0 14px #ffd700aa}
@keyframes rarPulse{to{box-shadow:0 0 22px #b545ff44,inset 0 0 30px #b545ff40}}
@keyframes rarFlame{to{box-shadow:0 0 26px #ff2a5566,inset 0 0 34px #ff2a5544}}
@keyframes rarLeg{0%{box-shadow:0 0 14px #ffd70044,inset 0 0 20px #ffd70022;border-color:#cca100}100%{box-shadow:0 0 32px #ffd700aa,inset 0 0 42px #ffd70055;border-color:#fff2a6}}
@keyframes shine{to{background-position:-200% 0}}

/* TABS */
.tabs{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.tab{flex:1;min-width:110px;padding:11px 10px;background:var(--card);color:var(--mut);border:1px solid var(--line);font-size:15px;cursor:pointer;transition:.16s;display:flex;align-items:center;justify-content:center;gap:7px;text-transform:uppercase}
.tab.on{background:linear-gradient(135deg,var(--red),#b82542);color:#fff;border-color:transparent;box-shadow:0 4px 16px #ff3b5c44}
.tab:hover:not(.on){color:var(--ink);background:var(--card2);border-color:#3a4b63}

/* CARDS & COMMON UI */
.card{background:linear-gradient(180deg,var(--card2),var(--card) 65%);padding:20px;margin-bottom:14px;border-top:3px solid var(--red);border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mut{color:var(--mut)}
h2{font-size:23px;margin-bottom:8px;text-transform:uppercase}
h3{font-size:17px;margin-bottom:8px;text-transform:uppercase;color:var(--cy)}
.btn{background:var(--red);color:#fff;border:0;font-size:16px;padding:12px 22px;cursor:pointer;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:.15s;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}
.btn.cy{background:var(--cy);color:#061017}
.btn.gr{background:var(--gr);color:#061017}
.btn.vi{background:var(--vi);color:#fff}
.btn.ye{background:var(--ye);color:#090c10}
.btn.gh{background:var(--line);color:var(--ink);font-size:14px;padding:9px 15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{background:#090d13;color:var(--ink);border:2px solid var(--line);padding:9px 15px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.chip:hover{border-color:#455a75}
.chip.on{border-color:var(--cy);color:var(--cy);background:#00e5ff12;box-shadow:0 0 14px #00e5ff33}
input[type=number],input[type=text],select{background:#080c12;border:2px solid var(--line);color:var(--ink);padding:8px 11px;font:inherit;border-radius:4px}
input[type=number]{width:115px}
input:focus-visible,button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.kv{margin:12px 0;color:var(--mut)}.kv b{color:var(--ye);font-size:23px;margin-left:8px}
.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hud b{display:block;font-size:22px}
.bar{position:relative;height:15px;background:#080b10;border:2px solid var(--line);margin:10px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--cy));transition:width .5s}
.bar em{position:absolute;right:-6px;top:-13px;font-style:normal;color:var(--ye);line-height:0}

/* START HUB SCREEN */
.hero{text-align:center;padding:26px 18px;background:radial-gradient(circle at 50% 0%,#00e5ff22,transparent 65%),linear-gradient(180deg,#1a2636,var(--card));border-top:3px solid var(--cy)}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px;text-align:left}
.hub-card{background:#0b1018;border:1px solid var(--line);border-left:4px solid var(--c,var(--cy));padding:16px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.hub-card:hover{transform:translateY(-4px);border-color:var(--c,var(--cy));box-shadow:0 8px 24px #0008}
.hub-card h3{color:var(--c,var(--cy));margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.hub-card p{font-size:13px;color:var(--mut)}
.hub-stat{font:700 13px Rubik,sans-serif;color:var(--ink);padding-top:6px;border-top:1px solid #ffffff0f}

/* 10 DOORS & PANELS */
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.door{--c:var(--red);background:var(--card);border:1px solid var(--line);border-bottom:4px solid var(--c);padding:14px;cursor:pointer;color:var(--ink);font:inherit;text-align:center;transition:.2s;position:relative}
.door:hover:not(.open){transform:translateY(-6px);background:#1b2636;border-color:var(--c)}
.door.dim{opacity:.35;pointer-events:none}
.risk-pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#080b10;color:var(--c);border:1px solid var(--c);margin-bottom:5px;text-transform:uppercase;font-weight:700}
.nm{font-size:17px;color:var(--c);text-shadow:0 0 10px color-mix(in srgb,var(--c) 40%,transparent);min-height:24px}
.frame{height:146px;background:#030508;position:relative;perspective:600px;margin:8px auto 10px;width:118px;border:4px solid #3a4450;border-radius:58px 58px 0 0;overflow:hidden;box-shadow:0 0 0 2px #000}
.frame:before{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(0deg,var(--c),transparent);opacity:.28;animation:fl 2.4s ease-in-out infinite alternate;z-index:1;pointer-events:none}
@keyframes fl{to{opacity:.65}}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,#fff5d6,var(--c) 42%,transparent 75%);opacity:0;transition:opacity .7s}
.panel{position:absolute;inset:0;transform-origin:left center;transition:transform .7s;box-shadow:inset 0 0 30px #000d,inset -8px 0 14px #0009}
.panel:after{content:"";position:absolute;pointer-events:none}
.open .panel{transform:rotateY(-82deg)}.open .glow{opacity:1}

/* 10 UNIQUE DOOR DESIGNS (p0..p9) */
/* p0: Солнечная терраса */
.panel.p0{background:radial-gradient(circle at 50% 32%,#ffe875aa 0 18px,transparent 28px),repeating-linear-gradient(90deg,#5b4328 0 14px,#3e2c18 14px 16px),linear-gradient(180deg,#8a663d,#4b351e)}
.panel.p0:after{left:50%;top:32%;width:38px;height:38px;margin:-19px;border:3px solid #ffd859;border-radius:50%;box-shadow:0 0 14px #ffd859,inset 0 0 10px #ffd859}
/* p1: Сад безмятежности */
.panel.p1{background:radial-gradient(circle at 30% 25%,#4fd1b044,transparent 45%),radial-gradient(circle at 75% 70%,#2ee86c44,transparent 45%),repeating-linear-gradient(0deg,#1b3b32 0 18px,#112620 18px 21px),#163028}
.panel.p1:after{left:50%;top:45%;width:30px;height:46px;margin:-23px -15px;border:3px solid #4fd1b0;border-radius:15px 15px 4px 4px;box-shadow:0 0 12px #4fd1b0}
/* p2: Библиотечный зал */
.panel.p2{background:linear-gradient(0deg,transparent 15%,#2b1d12 15% 22%,transparent 22% 75%,#2b1d12 75% 82%,transparent 82%),repeating-linear-gradient(90deg,#59361f 0 18px,#331d0f 18px 20px)}
.panel.p2:after{left:50%;top:50%;width:28px;height:36px;margin:-18px -14px;border:3px solid #e6b86a;background:linear-gradient(90deg,#7a4f25 50%,#543415 50%);box-shadow:0 0 10px #000}
/* p3: Механический шлюз */
.panel.p3{background:repeating-linear-gradient(135deg,#2d3640 0 10px,#20272e 10px 20px),linear-gradient(180deg,#485460,#1e252b)}
.panel.p3:after{left:50%;top:48%;width:42px;height:42px;margin:-21px;border:6px dashed #e0823b;border-radius:50%;background:radial-gradient(circle,#ff9f43 0 6px,#1e252b 7px);box-shadow:0 0 12px #e0823b88}
/* p4: Зеркальная галерея */
.panel.p4{background:linear-gradient(125deg,#182b49 0%,#3ba8e055 35%,#0e192d 50%,#3ba8e044 75%,#102038 100%);border-right:2px solid #7de2ff55}
.panel.p4:after{left:50%;top:46%;width:32px;height:52px;margin:-26px -16px;transform:skewY(-12deg);border:2px solid #80e5ff;background:linear-gradient(160deg,#ffffff55,transparent 60%);box-shadow:0 0 16px #3ba8e0}
/* p5: Алхимическая лаборатория */
.panel.p5{background:radial-gradient(circle at 50% 70%,#2ee86c55,transparent 50%),repeating-linear-gradient(90deg,#251a36 0 12px,#160f21 12px 15px)}
.panel.p5:after{left:50%;top:50%;width:32px;height:32px;margin:-16px;border-radius:50%;border:3px solid #b545ff;background:radial-gradient(circle,#2ee86c 0 7px,#b545ff 8px 12px,transparent 13px);box-shadow:0 0 16px #b545ff}
/* p6: Крипта древних рун */
.panel.p6{background:repeating-linear-gradient(0deg,#0007 0 2px,transparent 2px 34px),repeating-linear-gradient(90deg,#0005 0 2px,transparent 2px 50px),linear-gradient(170deg,#3d354b,#191521)}
.panel.p6:after{left:50%;top:43%;width:32px;height:32px;margin:-16px;transform:rotate(45deg);border:3px solid #ff55b8;background:radial-gradient(circle,#ffd6f0 0 4px,#ff55b8 5px 10px,transparent 11px);box-shadow:0 0 18px #ff55b8}
/* p7: Кузница титанов */
.panel.p7{background:repeating-linear-gradient(90deg,#2b2e33 0 4px,#52565d 4px 5px,transparent 5px 17px),repeating-linear-gradient(0deg,#2b2e33 0 4px,#52565d 4px 5px,transparent 5px 24px),radial-gradient(ellipse at 50% 85%,#ff6b2b,#471205 55%,#090504)}
.panel.p7:after{left:50%;bottom:16px;width:26px;height:20px;margin-left:-13px;background:linear-gradient(#ff9f43,#d9381e);border-radius:3px;box-shadow:0 -11px 0 -5px #ff9f43,0 0 12px #ff521b}
/* p8: Обсидиановый бастион */
.panel.p8{background:radial-gradient(circle at 50% 42%,#ff1e4288,transparent 55%),repeating-linear-gradient(45deg,#140910 0 8px,#240d18 8px 16px)}
.panel.p8:after{left:50%;top:42%;width:38px;height:22px;margin:-11px -19px;border-radius:50%;border:3px solid #ff2a55;background:radial-gradient(circle,#fff 0 3px,#ff0033 4px 9px,#1a0006 10px);box-shadow:0 0 20px #ff2a55}
/* p9: Врата Бездны */
.panel.p9{background:conic-gradient(from 0deg at 50% 48%,#090414,#ff005566,#6a00ff88,#00e5ff66,#090414)}
.panel.p9:after{left:50%;top:48%;width:44px;height:44px;margin:-22px;border-radius:50%;border:3px double #ffd700;background:radial-gradient(circle,#000 0 11px,#ff0055 12px 16px,transparent 18px);box-shadow:0 0 24px #ff0055,inset 0 0 14px #ffd700}

.od{display:grid;grid-template-columns:58px 1fr 42px;gap:6px;align-items:center;font-size:12px;margin-top:4px;text-align:left}
.od u{display:block;height:6px;background:#070a0f}.od u:after{content:"";display:block;height:100%;width:var(--w);background:var(--c)}
.od b{text-align:right}
.hist{display:flex;align-items:flex-end;gap:2px;height:30px;margin:8px 0 2px}
.hist i{flex:1;background:var(--c);opacity:.85;min-height:2px}
.hs{font-size:11px;color:var(--mut);text-align:left}

/* TIMER & REVEAL */
.ring{--p:0;--c:var(--red);width:240px;height:240px;border-radius:50%;margin:12px auto;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);animation:pulse 2.4s ease-in-out infinite}
.ring>div{width:206px;height:206px;border-radius:50%;background:var(--bg);display:grid;place-items:center;align-content:center;text-align:center}
.big{font-size:58px;line-height:1;font-weight:700}
.center{text-align:center}
@keyframes pulse{50%{box-shadow:0 0 36px color-mix(in srgb,var(--c) 45%,transparent)}}
.pop{text-align:center;animation:pop .45s;position:relative;overflow:hidden}
.pop>:not(.rays){position:relative}
.rays{position:absolute!important;left:50%;top:90px;width:540px;height:540px;margin:-270px;background:repeating-conic-gradient(color-mix(in srgb,var(--t) 26%,transparent) 0 8deg,transparent 8deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 5%,transparent 62%);mask-image:radial-gradient(circle,#000 5%,transparent 62%);animation:spin 16s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.tag{display:inline-block;padding:4px 16px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#090c10;background:var(--t);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);margin:4px 0 10px}
.tag.gold{background:linear-gradient(100deg,#b8860b,#ffe27a,#ffcf40,#b8860b);background-size:200% 100%;animation:shine 2.2s linear infinite}

/* STATS, LOGS & GRIDS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
.st{background:#090d14;padding:12px;border-left:4px solid var(--cy)}
.st span{display:block;color:var(--mut);font-size:12px}.st b{font-size:23px}
.st.r{border-color:var(--ye)}.st.v{border-color:var(--vi)}.st.d{border-color:var(--red)}.st.g{border-color:var(--gr)}
.log{list-style:none;padding:0;max-height:360px;overflow-y:auto}
.log li{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.log small{color:var(--mut);font-size:12px}.plus{color:var(--gr)}.minus{color:var(--red)}
.muscle-bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:10px}
.m-row{background:#090d14;padding:9px 12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.m-top{display:flex;justify-content:space-between;font-size:13px}
.m-bar{height:6px;background:#16202e;border-radius:3px;overflow:hidden}
.m-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--gr))}

/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px}
.ach{background:#0b1018;border:1px solid var(--line);padding:14px;display:flex;gap:12px;align-items:center;position:relative;transition:.2s}
.ach.t1{border-color:#cd7f32aa;box-shadow:inset 0 0 16px #cd7f3218}
.ach.t2{border-color:#b545ffaa;box-shadow:inset 0 0 20px #b545ff22}
.ach.t3{border-color:#ffd700;box-shadow:0 0 16px #ffd70033,inset 0 0 24px #ffd70025}
.ach-ic{width:58px;height:58px;border-radius:14px;background:#070a0f;display:grid;place-items:center;flex-shrink:0;position:relative;border:2px solid var(--ac,#2c3a4d)}
.ach.t1 .ach-ic{--ac:#e09145;color:#e09145;box-shadow:0 0 12px #e0914544}
.ach.t2 .ach-ic{--ac:#c466ff;color:#c466ff;box-shadow:0 0 16px #b545ff66}
.ach.t3 .ach-ic{--ac:#ffd700;color:#ffd700;box-shadow:0 0 22px #ffd70088;animation:rarLeg 1.3s infinite alternate}
.ach-body{flex:1;min-width:0}
.ach-lvl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.ach-ttl{font:700 15px 'Russo One',sans-serif;color:#fff;margin:2px 0}
.ach-desc{font-size:12px;color:var(--mut);margin-bottom:6px}

/* SETTINGS & CHANCES TABLE */
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.cfg label{display:flex;flex-direction:column;gap:5px;color:var(--mut);font-size:13px}
.door-cfg-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.door-cfg-item{background:#090d14;border:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:180px repeat(5,1fr);gap:8px;align-items:center;font-size:13px}
.door-cfg-item input{width:100%!important;padding:5px 7px}

/* MODAL / DISCLAIMER */
.modal-bg{position:fixed;inset:0;background:#000c;backdrop-filter:blur(5px);z-index:50;display:grid;place-items:center;padding:16px}
.modal{max-width:480px;width:100%;background:var(--card2);border:2px solid var(--ye);padding:22px;animation:pop .25s}

/* CAREER LADDER LIST */
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:12px}
.lad-col{background:#090d14;border:1px solid var(--line);padding:12px;max-height:420px;overflow-y:auto}
.lad-row{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;border-bottom:1px solid #ffffff0a;font-size:13px;border-left:3px solid var(--rc,#666);margin-bottom:4px;background:#0e141d}
.lad-row.cur{background:#ffffff14;outline:1px solid var(--rc)}
.lad-row.done{opacity:.88}

.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
@media(max-width:700px){
  .doors{grid-template-columns:1fr}

function getAchState(a){

  const prevTarget=lvl===0?0:a.t[lvl-1];
  const pct=lvl>=3?100:Math.max(0,Math.min(100,((v-prevTarget)/(nextTarget-prevTarget))*100));
  return {v,lvl,nextTarget,pct};

/* SOUND ENGINE */
let AC=null;
const tone=(f,t,d,ty='sine',v=.16,f2)=>{const c=AC,o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t;o.type=ty;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(0.0001,n);g.gain.linearRampToValueAtTime(v,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.05)};

const DUR=[10,15,20,25,30,35,40,45,50,55,60];
const dw=(c,d)=>Math.exp(-((d-c)**2)/242);
const hm=n=>{const h=Math.floor(n/60),m=Math.round(n%60);return h?h+' ч'+(m?' '+m+' мин':''):m+' мин'};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const money=(m,u)=>m==='study'?u*S.cfg.rs/60:u*S.cfg.rw;

function pickDur(c,rem){
  const ds=DUR.filter(d=>d<=rem);
  if(!ds.length)return rem;
  let x=Math.random()*ds.reduce((a,d)=>a+dw(c,d),0),p=ds[ds.length-1];
  for(const d of ds){x-=dw(c,d);if(x<=0){p=d;break}}
  return rem-p<10&&rem<=60?rem:p;
}

const TC={g:'#2ee86c',l:'#8fd14f',y:'#ffd026',o:'#ff8a2b',r:'#ff3b5c',au:'#ffd700'};
function tier(t,d){
  if(t==='key')return[TC.au,'Ключ','au'];
  if(t==='game')return[TC.au,'Катка','au'];
  if(t==='rest')return d>=15?[TC.g,'Долгий отдых','g']:d>=10?[TC.l,'Отдых','l']:[TC.y,'Передышка','y'];
  return d>=50?[TC.r,'Адская','r']:d>=40?[TC.o,'Тяжёлая','o']:d>=25?[TC.y,'Обычная','y']:[TC.l,'Лёгкая','l'];
}
const TIPS=['Выпей стакан воды','Сделай 15 приседаний','Разомни шею и плечи','Посмотри вдаль 20 секунд','Пройдись по комнате','Глубоко подыши: вдох на 4 счёта, выдох на 4','Потянись и встряхни кисти'];

/* EFFECTIVE DOOR CHANCES WITH STEP>=3 PROTECTION & EARLY KEY PENALTY */
function getDoorOdds(door,step=0){
  const canKey=step>=3;
  const streakPen=Math.pow(0.5,S.stats.earlyStreak||0);
  let k=canKey?+(door.k*(S.cfg.kMult||1)*streakPen).toFixed(2):0;
  let g=+(door.g*(S.cfg.gMult||1)).toFixed(2);
  let r=+(door.r*(S.cfg.rMult||1)).toFixed(1);
  if(k+g+r>95){const sc=95/(k+g+r);k=+(k*sc).toFixed(2);g=+(g*sc).toFixed(2);r=+(r*sc).toFixed(1);}
  const s=+(100-k-g-r).toFixed(1);
  return {s,r,g,k,canKey,streakPen};
}

/* PICK 3 DOORS & SORT BY RISK/KEY CHANCE ASCENDING (#5 & #19) */
function pickDoors(){
  const pool=S.cfg.doors.slice().sort(()=>Math.random()-.5).slice(0,3);
  return pool.sort((a,b)=>(a.k+a.g)-(b.k+b.g)||a.c-b.c);
}

/* RANK CALCULATION (#14 & #15) */
function calcRank(list,val){
  let lvl=0;
  for(let i=0;i<list.length;i++){if(val>=list[i][0])lvl=i;}
  const curReq=list[lvl][0];
  const nextReq=lvl<list.length-1?list[lvl+1][0]:curReq;
  const pct=lvl>=list.length-1?100:Math.max(0,Math.min(100,((val-curReq)/(nextReq-curReq))*100));
  const rar=getRarityIdx(lvl);
  return {lvl,name:list[lvl][1],curReq,nextReq,pct,rar,rarName:RARITY_NAMES[rar],max:lvl>=list.length-1};
}

function getStudyRank(){return calcRank(STUDY_RANKS,+(S.stats.min/60).toFixed(2));}
function getSportRank(){return calcRank(SPORT_RANKS,S.stats.wk||0);}

/* LABYRINTH RESOLUTION LOGIC (#2, #3, #5) */
function resolveDoor(i){
  const r=S.run.study;if(!r||r.op!==i)return;
  const d=r.d[i],od=getDoorOdds(d,r.step),x=Math.random()*100,rem=r.target-r.prog;
  const type=x<od.k?'key':x<od.k+od.g?'game':x<od.k+od.g+od.r?'rest':'focus';

  if(type==='key'){
    r.phase='done';r.early=true;
    S.stats.keys++;
    S.stats.earlyKeys=(S.stats.earlyKeys||0)+1;
    S.stats.earlyStreak=(S.stats.earlyStreak||0)+1;
    if(S.cfg.full&&rem>0)r.earned+=Math.round(money('study',rem));
    creditMoney(r.earned);
    addStudyLog(`Учёба: ${hm(r.prog)} (ключ найден на ходу ${r.step+1})`,r.earned);
    snd('key');burst(TC.au,160);
  }else{
    const dur=type==='game'?0:type==='rest'?5*rnd(1,3):pickDur(d.c,rem);
    const t=tier(type,dur);
    r.cur={type,dur,left:dur*60000,end:0,paused:true,tip:type==='rest'?TIPS[rnd(0,TIPS.length-1)]:''};
    r.phase='reveal';
    snd('t_'+t[2]);burst(t[0],t[2]==='r'||t[2]==='au'?90:45);
  }
  save();render();
}

function finishStudyRoom(){
  const r=S.run.study;if(!r||!r.cur)return;
  const c=r.cur;
  r.step=(r.step||0)+1;
  if(c.type==='focus'){
    const u=c.dur;
    r.prog+=u;
    S.stats.min+=u;
    r.earned+=Math.round(money('study',u));
  }else if(c.type==='game'){
    S.stats.games=(S.stats.games||0)+1;
  }
  r.cur=null;
  if(r.prog>=r.target){
    r.phase='done';r.early=false;
    S.stats.keys++;
    S.stats.fullRuns=(S.stats.fullRuns||0)+1;
    /* #2: Reset early key penalty when full study plan is completed without early key */
    S.stats.earlyStreak=0;
    creditMoney(r.earned);
    addStudyLog(`Учёба (полный план): ${hm(r.prog)}`,r.earned);
    snd('key');burst('#ffd700',140);
  }else{
    r.phase='doors';r.d=pickDoors();r.op=-1;snd('done');
  }
  save();render();
}

/* ACTIONS */
const A={
  tab:d=>{S.tab=d.v;modalState=null;save();render()},
  histTab:d=>{S.histTab=d.v;save();render()},
  mute:()=>{S.mute=!S.mute;save();render();snd('tick')},
  sel:d=>{S.sel.study=+d.v;save();render()},
  startStudy:()=>{
    S.run.study={phase:'doors',target:Math.max(10,S.sel.study),prog:0,earned:0,step:0,d:pickDoors(),op:-1};
    save();render();
  },
  openDoor:d=>{
    const r=S.run.study;if(!r||r.op>=0)return;
    r.op=+d.v;snd('open'+(+d.v%3));shake();render();
    setTimeout(()=>resolveDoor(+d.v),750);
  },
  startTimer:()=>{
    const r=S.run.study;if(!r||!r.cur)return;
    r.cur.end=Date.now()+r.cur.left;r.cur.paused=false;r.phase='timer';
    save();render();
  },
  pauseTimer:()=>{
    const c=S.run.study?.cur;if(!c)return;
    if(c.paused){c.end=Date.now()+c.left;c.paused=false}
    else{c.left=c.end-Date.now();c.paused=true}
    save();render();
  },
  finishRoom:()=>finishStudyRoom(),
  cancelRoom:()=>{
    const r=S.run.study;if(!r)return;
    r.cur=null;r.phase='doors';r.d=pickDoors();r.op=-1;save();render();
  },
  cashoutAsk:()=>{modalState='cashout';renderModal()},
  cashoutConfirm:()=>{
    const r=S.run.study;
    if(r&&r.earned>0){
      creditMoney(r.earned);
      addStudyLog(`Учёба (досрочный вывод): ${hm(r.prog)}`,r.earned);
      snd('done');burst('#ffd026',90);
    }
    S.run.study=null;modalState=null;save();render();
  },
  resetAsk:()=>{modalState='reset';renderModal()},
  resetConfirm:()=>{S.run.study=null;modalState=null;save();render()},
  endStudyRun:()=>{S.run.study=null;save();render()},
  closeModal:()=>{modalState=null;renderModal()},

  /* WORKOUT ACTIONS (#1 & #10) */
  toggleMuscle:d=>{
    const id=d.v,arr=S.wkForm.sel;
    const idx=arr.indexOf(id);
    if(idx>=0)arr.splice(idx,1);else arr.push(id);
    save();render();
  },
  logWorkout:()=>{
    const durInp=$('#wk-dur-inp'),custInp=$('#custom-act-inp');
    const dur=durInp?Math.max(0,+durInp.value||0):0;
    const cust=custInp?custInp.value.trim():'';
    const sel=S.wkForm.sel.length?S.wkForm.sel:['home'];

    S.stats.wk=(S.stats.wk||0)+1;
    if(dur>0)S.stats.wkMin=(S.stats.wkMin||0)+dur;

    const names=[];
    sel.forEach(id=>{
      S.stats.muscles[id]=(S.stats.muscles[id]||0)+1;
      const m=MUSCLES.find(x=>x.id===id);
      if(m)names.push(id==='other'&&cust?`Другое (${cust})`:m.n);
    });
    if(sel.includes('other')&&cust){
      S.stats.customActs[cust]=(S.stats.customActs[cust]||0)+1;
    }

    const earned=creditMoney(S.cfg.rw);
    addWorkLog(`Тренировка: ${names.join(', ')}${dur?` (${dur} мин)`:''}`,earned);
    S.wkForm.dur='';S.wkForm.customName='';
    snd('key');burst('#2ee86c',110);
    save();render();
  },

  /* PROFILE & MEDALS (#7, #18) */
  setAva:d=>{S.profile.ava=d.v;save();render()},
  setAccent:d=>{S.profile.accent=d.v;save();render()},
  saveProfile:()=>{
    const n=$('#prof-nick-inp')?.value.trim(),t=$('#prof-title-inp')?.value.trim();
    if(n)S.profile.nick=n;
    if(t)S.profile.title=t;
    snd('done');burst(S.profile.accent,60);save();render();
  },
  pinMedal:d=>{
    const id=d.v;
    S.profile.medals=S.profile.medals||[];
    const idx=S.profile.medals.indexOf(id);
    if(idx>=0)S.profile.medals.splice(idx,1);
    else{
      if(S.profile.medals.length>=4)S.profile.medals.shift();
      S.profile.medals.push(id);
    }
    snd('tick');save();render();
  },

  /* BANK (#11) */
  topup:()=>{
    const v=Math.round(+$('#am').value);if(!(v>0))return;
    S.bank.card+=v;addBankLog('Пополнение депозита карты',v);
    snd('done');save();render();
  },
  payout:()=>{
    let v=Math.round(+$('#pm').value);v=Math.min(v,S.bank.pend);if(!(v>0))return;
    S.bank.pend-=v;S.bank.paid+=v;S.bank.card=Math.max(0,S.bank.card-v);
    addBankLog('Выплата заработанных средств',-v);
    snd('done');save();render();
  },

  /* SETTINGS (#4, #8) */
  resetDoorsCfg:()=>{
    S.cfg.doors=JSON.parse(JSON.stringify(DEF_DOORS));
    S.cfg.kMult=1;S.cfg.gMult=1;S.cfg.rMult=1;
    save();render();
  },
  wipeAsk:()=>{modalState='wipe';renderModal()},
  wipeConfirm:()=>{S=DEF();modalState=null;save();render()}
};

});

document.addEventListener('input',e=>{
  if(e.target.id==='wk-dur-inp')S.wkForm.dur=e.target.value;
  if(e.target.id==='custom-act-inp')S.wkForm.customName=e.target.value;
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.door!==undefined){
    const idx=+t.dataset.door,f=t.dataset.df,val=Math.max(0,+t.value||0);
    const d=S.cfg.doors[idx];
    if(d){
      d[f]=val;
      d.s=Math.max(1,+(100-d.r-d.g-d.k).toFixed(1));
      save();render();
    }
    return;
  }
  const k=t.dataset.k;if(!k)return;
  if(k==='selStudy')S.sel.study=Math.max(10,+t.value||60);
  else if(k==='full')S.cfg.full=t.checked;
  else S.cfg[k]=Math.max(0,+t.value||0);
  save();render();
});

/* TIMER LOOP */
setInterval(()=>{
  const r=S.run.study;
  if(!r||r.phase!=='timer'||!r.cur||r.cur.paused)return;
  r.cur.left=r.cur.end-Date.now();
  if(r.cur.left<=0){finishStudyRoom();return}
  if(S.tab==='study'){
    const t=$('#tm'),g=$('#ring');
    if(t)t.textContent=mmss(r.cur.left);
    if(g)g.style.setProperty('--p',(1-r.cur.left/(r.cur.dur*60000))*100);
  }
},400);

/* BACKGROUND CANVAS & PARTICLES */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const bg=$('#bg'),fx=$('#fx'),bx=bg.getContext('2d'),fc=fx.getContext('2d');
let W=0,H=0,PT=[];
const rgb=h=>{
  const c=h.startsWith('#')?h:'#00e5ff';
  return [1,3,5].map(i=>parseInt(c.substr(i,2),16)||180).join(',');
};
function drawGrid(){
  W=bg.width=fx.width=innerWidth;H=bg.height=fx.height=innerHeight;
  bx.clearRect(0,0,W,H);
  bx.strokeStyle='rgba(0,229,255,0.04)';bx.lineWidth=1;
  const s=48;
  bx.beginPath();
  for(let x=0;x<W;x+=s){bx.moveTo(x,0);bx.lineTo(x,H)}
  for(let y=0;y<H;y+=s){bx.moveTo(0,y);bx.lineTo(W,y)}
  bx.stroke();
}
function ember(){return{x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.25,vy:-.25-Math.random()*.5,r:1+Math.random()*2,c:'0,229,255',t:0}}
function burst(h,n=60){
  if(RM)return;const c=rgb(h);
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,s=2+Math.random()*6;
    PT.push({x:W/2,y:H*.38,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:1.5+Math.random()*3,l:1,d:.012+Math.random()*.012,c,t:1});
  }
}
function shake(){if(RM)return;const w=$('.wrap');w.classList.add('shake');setTimeout(()=>w.classList.remove('shake'),450)}
function loop(){
  fc.clearRect(0,0,W,H);PT=PT.filter(p=>!p.t||p.l>0);
  for(const p of PT){
    p.x+=p.vx;p.y+=p.vy;
    if(p.t){p.vy+=.06;p.l-=p.d}
    else{if(p.y<-10){p.y=innerHeight+10;p.x=Math.random()*innerWidth}}
    const a=p.t?Math.max(p.l,0):.25+.2*Math.sin((p.y+p.x)/60);
    fc.fillStyle='rgba('+p.c+','+a+')';fc.beginPath();fc.arc(p.x,p.y,p.r,0,6.3);fc.fill();
  }
  requestAnimationFrame(loop);
}
drawGrid();
if(!RM){for(let i=0;i<36;i++)PT.push(ember());loop()}
addEventListener('resize',drawGrid);

/* KEYBOARD SHORTCUTS */
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const k=e.key;
  if(k==='Escape'&&modalState){A.closeModal();return;}
  if(k==='m'||k==='M'||k==='ь'||k==='Ь'){A.mute();return;}
  if(S.tab==='study'){
    const r=S.run.study;
    if(!r){if(k==='Enter')A.startStudy();return;}
    if(r.phase==='doors'&&'123'.includes(k))A.openDoor({v:+k-1});
    else if(r.phase==='reveal'&&(k===' '||k==='Enter')){e.preventDefault();r.cur?.type==='game'?A.finishRoom():A.startTimer();}
    else if(r.phase==='timer'){if(k===' '){e.preventDefault();A.pauseTimer();}else if(k==='Enter')A.finishRoom();}
    else if(r.phase==='done'&&k==='Enter')A.endStudyRun();
  }
});

render();
})();
</script>
</body>
</html>
